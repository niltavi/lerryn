name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: lerryn-linux
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: ${{ gitea.server_url }}
          token: ${{ gitea.token }}
      - uses: https://github.com/docker/setup-qemu-action@v4
      - uses: https://github.com/docker/setup-buildx-action@v4
      - uses: https://github.com/docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: meta
        uses: https://github.com/docker/metadata-action@v6
        with:
          images: ghcr.io/niltavi/lerryn
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(gitea.ref_name, '-') }}
      - uses: https://github.com/docker/build-push-action@v7
        env:
          # Build records use GitHub's artifact service.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ gitea.ref_name }}
            COMMIT=${{ gitea.sha }}
