# S2 验证用的小规范，只用来检查 OpenAPI 3.1 生成链路，不是正式契约。
# 覆盖：type 数组形式的 nullable、oneOf + discriminator、oneOf + const 枚举、
# webhooks、application/problem+json、游标分页包络、$ref 旁的兄弟关键字。
openapi: 3.1.0
info:
  title: Lerryn S2 spike
  version: 0.0.0
  description: S2 验证用的小规范。
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
    description: 本地
security:
  - accessToken: []
  - sessionCookie: []
tags:
  - name: runs
    description: 运行
paths:
  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: 列出运行
      description: 按游标分页列出运行。
      x-operation-kind: read
      x-mcp:
        expose: false
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: 按状态过滤
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: 一页运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: 读取运行
      description: 读取一次运行。
      x-operation-kind: read
      x-mcp:
        expose: true
        tool: run_get
        description: 读取运行状态。
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{taskId}/triggers:
    put:
      operationId: setTriggers
      tags: [runs]
      summary: 设置触发器
      description: 整体替换任务的触发器。
      x-operation-kind: mutate
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任务 ID
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: 已读的触发器版本
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: 幂等键
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [triggers]
              properties:
                triggers:
                  type: array
                  items:
                    $ref: "#/components/schemas/Trigger"
      responses:
        "200":
          description: 新的触发器列表
          content:
            application/json:
              schema:
                type: object
                required: [triggers, version]
                properties:
                  triggers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trigger"
                  version:
                    type: integer
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
webhooks:
  run.finished:
    post:
      operationId: runFinishedNotification
      summary: 运行结束通知
      description: 运行进入终态时，平台向订阅的 webhook 出口发送此载荷。
      x-operation-kind: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunFinishedEvent"
      responses:
        "204":
          description: 接收方已收到
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      description: 访问令牌
    sessionCookie:
      type: apiKey
      in: cookie
      name: lerryn_session
      description: 控制台会话
  parameters:
    Limit:
      name: limit
      in: query
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 next_cursor
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      description: 运行 ID
      schema:
        type: string
  responses:
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    # --- problem+json ---
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          exclusiveMaximum: 600
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ErrorCode"
        next_actions:
          type: array
          items:
            $ref: "#/components/schemas/NextAction"
        request_id:
          type: string
      additionalProperties: true
    NextAction:
      type: object
      required: [action, hint]
      properties:
        action:
          type: string
        hint:
          type: string
    # 3.1 写法：oneOf + const 声明枚举，每个值带说明。oapi-codegen 要求每个分支都有
    # title（作为 Go 常量名），缺了 title 就退化成普通 string。
    ErrorCode:
      type: string
      oneOf:
        - title: ErrorCodeValidationFailed
          const: validation_failed
          description: 清单或参数校验失败
        - title: ErrorCodeVersionConflict
          const: version_conflict
          description: 任务已被其他会话修改
        - title: ErrorCodeNotFound
          const: not_found
          description: 资源不存在或无权访问
    # 同样是枚举，但分支没有 title，用来对比生成结果。
    StageState:
      type: string
      oneOf:
        - const: started
          description: 阶段开始
        - const: done
          description: 阶段完成
    # --- 分页 ---
    CursorPage:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: 下一页游标，没有更多数据时为 null
    RunPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Run"
    # --- nullable ---
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    Run:
      type: object
      required: [id, status, finished_at, exit_code, error, labels, links]
      properties:
        id:
          type: string
          examples: [run_01JD9]
        status:
          $ref: "#/components/schemas/RunStatus"
          description: $ref 旁的 description（3.1 允许兄弟关键字）
        finished_at:
          description: 必填且可为 null
          type: [string, "null"]
          format: date-time
        exit_code:
          description: 必填且可为 null 的整数
          type: [integer, "null"]
        attempt:
          description: 可选且可为 null
          type: [integer, "null"]
          minimum: 1
        progress:
          description: 3.1 数值型 exclusiveMinimum
          type: number
          exclusiveMinimum: 0
          maximum: 1
        error:
          description: 必填且可为 null 的对象，oneOf + null 写法
          oneOf:
            - $ref: "#/components/schemas/RunError"
            - type: "null"
        principal:
          description: 可选且可为 null 的对象，anyOf + null 写法
          anyOf:
            - $ref: "#/components/schemas/Principal"
            - type: "null"
        labels:
          description: 可为 null 的数组
          type: [array, "null"]
          items:
            type: string
        priority:
          description: 可为 null 的枚举
          type: [string, "null"]
          enum: [low, normal, high, null]
        links:
          $ref: "#/components/schemas/Links"
    RunError:
      type: object
      required: [code, stage]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        stage:
          type: [string, "null"]
        stage_state:
          $ref: "#/components/schemas/StageState"
    Principal:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
    Links:
      type: object
      required: [console]
      properties:
        console:
          type: string
          format: uri
    # --- oneOf + discriminator ---
    Trigger:
      oneOf:
        - $ref: "#/components/schemas/CronTrigger"
        - $ref: "#/components/schemas/WebhookTrigger"
      discriminator:
        propertyName: type
        mapping:
          cron: "#/components/schemas/CronTrigger"
          webhook: "#/components/schemas/WebhookTrigger"
    CronTrigger:
      type: object
      required: [type, schedule, timezone]
      properties:
        type:
          type: string
          const: cron
        schedule:
          type: string
        timezone:
          type: string
    WebhookTrigger:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: webhook
        max_body:
          type: [integer, "null"]
    # --- webhooks 载荷 ---
    RunFinishedEvent:
      type: object
      required: [event, run]
      properties:
        event:
          type: string
          const: run.finished
        run:
          $ref: "#/components/schemas/Run"
