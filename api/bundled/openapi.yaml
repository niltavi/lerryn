    RunEventKind:
      type: string
      description: |
        运行事件的类别。status 状态变化（data 为 `{"from": 状态, "to": 状态}`）；stage.start、stage.done、stage.fail 阶段事件；
        result 业务结果（data 为 RunResult）；tool.call 经 `sbx mcp call` 记录的工具调用（data 为 ToolCallRecord）；
        artifact 新增产物（data 为 `{"artifact_id": ID, "path": 路径}`）；warning 平台告警，例如容器内有进程因内存超限被杀但主进程以 0 退出；
        log.truncated 日志超过上限开始丢弃（data 为 `{"dropped_lines": 行数, "dropped_bytes": 字节数}`）。
        以后可能增加类别，不认识的类别应忽略。
      enum:
        - status
        - stage.start
        - stage.done
        - stage.fail
        - result
        - tool.call
        - artifact
        - warning
        - log.truncated
