    TriggerType:
      type: string
      description: cron 为定时触发；webhook 为外部系统以 HTTP 请求触发。
      enum:
        - cron
        - webhook
    CatchUp:
      type: string
      description: |
        服务停机错过计划时间后的处理（技术设计第 8.2 节）。skip：不补跑，记一条已跳过的运行，注明错过的次数和时间范围；
        latest：恢复后只补跑一次，其余记为已跳过。计划时间早于当前时间超过 60 秒（部署可调）视为错过。
      enum:
        - skip
        - latest
    TriggerInput:
      type: object
      description: |
        一个触发器的期望状态。setTriggers 按 `name` 对应已有的触发器：同名同类型的保留 ID 和 webhook 令牌，
        没有列出的被删除。cron 必须给出 schedule 和 timezone。
      required:
        - name
        - type
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          description: 触发器名，任务内唯一。
          examples:
            - weekday-morning
        type:
          $ref: '#/components/schemas/TriggerType'
        enabled:
          type: boolean
          default: true
          description: 为 false 时保留触发器但不触发。任务未激活时所有触发器都不触发。
        schedule:
          type: string
          minLength: 1
          maxLength: 100
          description: 只用于 cron：五段 cron 表达式（分 时 日 月 周），也接受 `@daily`、`@hourly` 这类简写。
          examples:
            - 0 8 * * 1-5
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: 只用于 cron，必填：IANA 时区名。夏令时按该时区的本地时间计算。
          examples:
            - Asia/Shanghai
        catch_up:
          $ref: '#/components/schemas/CatchUp'
        max_body_bytes:
          type: integer
          minimum: 1024
          maximum: 10485760
          default: 1048576
          description: 只用于 webhook：请求体上限，超过时返回 413。
        params:
          type: object
          additionalProperties: true
          description: 这个触发器产生的运行使用的参数，整体替换清单中的 `params`。省略时使用清单的 `params`。含有已登记凭证的值（或它的 base64、URL 编码、JSON 转义）时请求被拒绝，返回 422 `validation_failed`。
    SetTriggersRequest:
      type: object
      description: 任务的全部触发器。整体替换：没有列出的触发器会被删除。
      required:
        - triggers
      additionalProperties: false
      properties:
        triggers:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TriggerInput'
    CronDetail:
      type: object
      required:
        - schedule
        - timezone
        - schedule_text
        - next_fires
      properties:
        schedule:
          type: string
        timezone:
          type: string
        schedule_text:
          type: string
          description: 人可读的频率，例如“每个工作日 08:00”。Agent 应向用户复述它和 next_fires。
        next_fires:
          type: array
          maxItems: 5
          description: 接下来最多 5 次计划触发的时间（UTC）。
          items:
            type: string
            format: date-time
    WebhookDetail:
      type: object
      required:
        - url
        - token_prefix
        - token
        - max_body_bytes
      properties:
        url:
          type: string
          format: uri
          description: 调用地址。用 POST 请求，令牌放在 Authorization 头中，写成 `Bearer <令牌>`。
        token_prefix:
          type: string
          description: 令牌的前几个字符，用来辨认。
        token:
          type:
            - string
            - 'null'
          description: 令牌本身，只在建立触发器或轮换令牌的那次响应中出现，其余时候为 null。请立即交给调用方保存。
        max_body_bytes:
          type: integer
    Trigger:
      type: object
      description: 任务的一个触发器。
      required:
        - id
        - name
        - type
        - enabled
        - catch_up
        - params
        - cron
        - webhook
        - next_fire_at
        - last_fired_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/TriggerType'
        enabled:
          type: boolean
        catch_up:
          $ref: '#/components/schemas/CatchUp'
        params:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: 触发器的参数，没有设置时为 null。
        cron:
          description: type 为 cron 时的详情，否则为 null。
          oneOf:
            - $ref: '#/components/schemas/CronDetail'
            - type: 'null'
        webhook:
          description: type 为 webhook 时的详情，否则为 null。
          oneOf:
            - $ref: '#/components/schemas/WebhookDetail'
            - type: 'null'
        next_fire_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 下一次触发时间。任务未激活、触发器停用或为 webhook 时为 null。
        last_fired_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TriggerSet:
      type: object
      description: 一个任务的全部触发器。
      required:
        - task_id
        - revision
        - dry_run
        - task_active
        - triggers
      properties:
        task_id:
          type: string
          format: uuid
        revision:
          type: integer
          description: 触发器集合的版本号，每次 setTriggers 加 1。修改时作为 If-Match 传回。
        dry_run:
          type: boolean
          description: 为 true 时是预览，没有保存。
        task_active:
          type: boolean
          description: 任务是否已激活。未激活时触发器不会产生运行，next_fire_at 为 null，但 cron.next_fires 仍给出预计时间。
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
    SkipNextRunRequest:
      type: object
      description: 用户确认跳过的下一次定时执行时间，防止重复请求跳过后续计划。
      required:
        - scheduled_at
      properties:
        scheduled_at:
          type: string
          format: date-time
          description: 任务当前最早的 next_fire_at。
    WebhookAccepted:
      type: object
      description: webhook 触发的结果。
      required:
        - run_id
        - status
        - duplicate
      properties:
        run_id:
          type: string
          format: uuid
          description: 产生的运行。因重叠或队列已满被跳过时，也会有一条已跳过的运行。
        status:
          $ref: '#/components/schemas/RunStatus'
        duplicate:
          type: boolean
          description: 同一个 Idempotency-Key 已经触发过，这里返回的是第一次的运行。
    Overview:
      type: object
      description: |
        概览看板的数据：需要处理的事、正在运行的任务、接下来的计划。只包含调用者能查看的数据，
        凭证相关的事项只包含调用者本人的。
      required:
        - generated_at
        - counts
        - attention
        - active
        - upcoming
      properties:
        generated_at:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/OverviewCounts'
        attention:
          type: array
          description: 需要处理的事，最新的在前，最多 50 项。
          items:
            $ref: '#/components/schemas/AttentionItem'
        active:
          type: array
          description: 排队中、准备中、运行中和取消中的运行，最早开始的在前，最多 50 项。
          items:
            $ref: '#/components/schemas/ActiveRun'
        upcoming:
          type: array
          description: 已激活任务接下来的计划触发，每个任务只列最近的一次，按时间排列，最多 50 项。
          items:
            $ref: '#/components/schemas/UpcomingFire'
    OverviewCounts:
      type: object
      required:
        - tasks
        - active_tasks
        - attention
        - running
        - queued
      properties:
        tasks:
          type: integer
          description: 未归档的任务数。
        active_tasks:
          type: integer
          description: 已激活的任务数。
        attention:
          type: integer
          description: 需要处理的事项数，可能多于 attention 列出的数量。
        running:
          type: integer
          description: 准备中、运行中和取消中的运行数。
        queued:
          type: integer
          description: 排队中的运行数。
    AttentionKind:
      type: string
      description: |
        需要处理的事的类别。run_failed、run_timed_out、run_interrupted：任务最近一次非测试运行以该状态结束，
        之后没有成功的运行；credential_request：等调用者填写的凭证请求；credential_expiring：调用者的凭证将在 7 天内到期，
        或已经过期但仍有任务引用；runner_offline：仅管理员可见，有 runner 失联。
      enum:
        - run_failed
        - run_timed_out
        - run_interrupted
        - credential_request
        - credential_expiring
        - runner_offline
    AttentionItem:
      type: object
      description: 一项需要处理的事。各字段与类别相关，不相关的为 null。
      required:
        - kind
        - at
        - task
        - run_id
        - stage
        - summary
        - credential_request_id
        - credential_id
        - runner_id
        - due_at
        - link
      properties:
        kind:
          $ref: '#/components/schemas/AttentionKind'
        at:
          type: string
          format: date-time
          description: 事情发生的时间：运行结束、请求创建、runner 最后在线的时间。
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        run_id:
          type:
            - string
            - 'null'
          format: uuid
        stage:
          type:
            - string
            - 'null'
          description: 运行失败时所在阶段的显示名。
        summary:
          type: string
          description: 简短的原因，已脱敏，最长 200 个字符。例如凭证名、错误说明或 runner 名。
        credential_request_id:
          type:
            - string
            - 'null'
          format: uuid
        credential_id:
          type:
            - string
            - 'null'
          format: uuid
        runner_id:
          type:
            - string
            - 'null'
        due_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 截止时间：填写请求或凭证的到期时间。
        link:
          type: string
          format: uri
          description: 处理这件事的页面：运行详情、凭证填写页或执行节点页。
    ActiveRun:
      type: object
      description: 一个未结束的运行。
      required:
        - run_id
        - task
        - status
        - test
        - trigger
        - queued_at
        - started_at
        - current_stage
        - links
      properties:
        run_id:
          type: string
          format: uuid
        task:
          $ref: '#/components/schemas/TaskRef'
        status:
          $ref: '#/components/schemas/RunStatus'
        test:
          type: boolean
        trigger:
          $ref: '#/components/schemas/TriggerKind'
        queued_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        current_stage:
          type:
            - string
            - 'null'
          description: 正在进行的阶段的显示名。
        links:
          $ref: '#/components/schemas/Links'
    UpcomingFire:
      type: object
      description: 一个任务的下一次计划触发。
      required:
        - task
        - trigger_id
        - at
        - schedule_text
      properties:
        task:
          $ref: '#/components/schemas/TaskRef'
        trigger_id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        schedule_text:
          type: string
          description: 人可读的频率，例如“每个工作日 08:00”。
    CalendarItem:
      type: object
      description: 日历中的一项：已有的运行，或尚未发生的计划触发。
      required:
        - kind
        - task
        - run_id
        - status
        - start
        - end
      properties:
        kind:
          type: string
          enum:
            - run
            - planned
        task:
          $ref: '#/components/schemas/TaskRef'
        run_id:
          type:
            - string
            - 'null'
          format: uuid
          description: kind 为 run 时的运行 ID。
        status:
          description: kind 为 run 时的运行状态。
          oneOf:
            - $ref: '#/components/schemas/RunStatus'
            - type: 'null'
        start:
          type: string
          format: date-time
          description: 运行的开始时间（未开始时为排队时间），或计划触发的时间。
        end:
          type:
            - string
            - 'null'
          format: date-time
          description: 运行的结束时间。未结束的运行和计划触发为 null。
        trigger_id:
          type:
            - string
            - 'null'
          format: uuid
          description: kind 为 planned 时产生这次触发的触发器，其他情况为 null。
        schedule_text:
          type:
            - string
            - 'null'
          description: kind 为 planned 时触发器人可读的频率，例如“每个工作日 08:00（Asia/Shanghai）”；其他情况为 null。
    Calendar:
      type: object
      description: 一段时间内的运行和计划触发，按开始时间排列。
      required:
        - from
        - to
        - items
        - truncated
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarItem'
        truncated:
          type: boolean
          description: 超过 2000 项时只返回最早的 2000 项。
    AIModelID:
      type: string
      minLength: 1
      maxLength: 200
      description: 服务商使用的模型 ID。
    AIModelList:
      type: object
      additionalProperties: false
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/AIModelID'
          description: 当前用户启用的模型，未配置时为空。
    AIConfiguration:
      type: object
      additionalProperties: false
      required:
        - models
      properties:
        base_url:
          type: string
          description: 已配置的 HTTPS API 基础地址，未配置时省略。
        models:
          type: array
          items:
            $ref: '#/components/schemas/AIModelID'
    SetAIConfigurationBody:
      type: object
      additionalProperties: false
      required:
        - base_url
        - models
      properties:
        base_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: 服务商的 HTTPS API 基础地址，包含服务商要求的版本路径，例如 https://api.openai.com/v1。
        api_key:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: 服务商的 API Key。地址不变时可省略以保留现有 Key。
        models:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: 允许内置 AI 工具调用的模型。
          items:
            $ref: '#/components/schemas/AIModelID'
    AIChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
        content:
          type: string
          minLength: 1
          maxLength: 8192
    AIChatBody:
      type: object
      additionalProperties: false
      required:
        - model
        - messages
      properties:
        model:
          $ref: '#/components/schemas/AIModelID'
        messages:
          type: array
          minItems: 1
          maxItems: 32
          description: 按对话顺序排列的文本消息。
          items:
            $ref: '#/components/schemas/AIChatMessage'
    AIChatResult:
      type: object
      additionalProperties: false
      required:
        - model
        - content
      properties:
        model:
          $ref: '#/components/schemas/AIModelID'
        content:
          type: string
          description: 模型生成的文本。
    CredentialFieldName:
      type: string
      description: 字段名，同时是注入时的环境变量名或文件名。
      pattern: ^[A-Z][A-Z0-9_]{0,63}$
      examples:
        - PRICE_API_TOKEN
    CredentialFieldSpec:
      type: object
      description: 填写请求中的一个字段。
      required:
        - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/CredentialFieldName'
        label:
          type: string
          maxLength: 60
          description: 填写页上显示的名称，省略时显示字段名。
        description:
          type: string
          maxLength: 200
          description: 填写说明，例如在哪里获取这个值。
        secret:
          type: boolean
          default: true
          description: 是否为机密。为 false 的字段（例如区域）在填写页上明文显示输入内容，但同样加密保存、提交后不回显。
        multiline:
          type: boolean
          default: false
          description: 多行输入，例如证书或 Cookie。
        optional:
          type: boolean
          default: false
    CreateCredentialRequestBody:
      type: object
      description: |
        发起凭证填写请求。新凭证给出 `task_id` 和 `name`（清单 credentials 中的引用名），填写后自动授权给该任务；
        更新已有凭证给出 `credential_id`，此时 task_id 和 name 可以省略。
      required:
        - purpose
        - fields
      additionalProperties: false
      properties:
        task_id:
          type: string
          format: uuid
          description: 使用这个凭证的任务。
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: 任务清单中的引用名，也是新凭证的名称。
        credential_id:
          type: string
          format: uuid
          description: 要更新的已有凭证。只能是调用者本人的凭证。
        purpose:
          type: string
          minLength: 1
          maxLength: 200
          description: 用途，显示在填写页上，例如“读取竞品价格接口”。
        fields:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CredentialFieldSpec'
        expires_in_minutes:
          type: integer
          minimum: 10
          maximum: 10080
          default: 1440
          description: 填写链接多少分钟后失效，默认 24 小时，最长 7 天。
    FillCredentialRequestBody:
      type: object
      description: 在控制台填写的凭证内容。
      required:
        - values
      additionalProperties: false
      properties:
        values:
          type: object
          description: 字段名到填写的内容。省略或留空的字段视为没有填写；请求中没有的字段名会被忽略。
          maxProperties: 10
          additionalProperties:
            type: string
    CredentialRequestStatus:
      type: string
      description: pending 等待填写；fulfilled 已填写；expired 链接已过期；cancelled 已取消。
      enum:
        - pending
        - fulfilled
        - expired
        - cancelled
    CredentialRequest:
      type: object
      description: 一个凭证填写请求。填写链接只能由发起请求的用户本人登录后打开。
      required:
        - id
        - status
        - url
        - name
        - purpose
        - task
        - credential_id
        - fields
        - client
        - created_at
        - expires_at
        - fulfilled_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CredentialRequestStatus'
        url:
          type: string
          format: uri
          description: 填写页的完整地址，交给用户在浏览器（包括手机浏览器）中打开。地址中不含任何机密。
        name:
          type: string
          description: 凭证名称（任务清单中的引用名）。
        purpose:
          type: string
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        credential_id:
          type:
            - string
            - 'null'
          format: uuid
          description: 填写后得到的凭证；更新请求为被更新的凭证。未填写时为 null。
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CredentialFieldSpec'
        client:
          type:
            - string
            - 'null'
          description: 发起请求时使用的访问令牌名，填写页上显示为“由哪个 Agent 发起”。
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        fulfilled_at:
          type:
            - string
            - 'null'
          format: date-time
    CredentialRequestPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CredentialRequest'
    CredentialStatus:
      type: string
      description: active 可用；revoked 已撤销；expired 已过期。后两种状态下新运行在准备阶段以 `credential_unavailable` 失败。
      enum:
        - active
        - revoked
        - expired
    CredentialRef:
      type: object
      description: 对凭证的引用。不含内容。
      required:
        - id
        - name
        - owner
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/CredentialStatus'
    CredentialGrant:
      type: object
      description: 凭证所有者把凭证授权给一个任务，按清单中的引用名注入。
      required:
        - task
        - name
        - granted_at
      properties:
        task:
          $ref: '#/components/schemas/TaskRef'
        name:
          type: string
          description: 任务清单中的引用名。
        granted_at:
          type: string
          format: date-time
    Credential:
      type: object
      description: 调用者本人的一个凭证。只有元信息，不含任何字段的值。
      required:
        - id
        - name
        - purpose
        - fields
        - status
        - version
        - expires_at
        - revoked_at
        - last_used_at
        - created_at
        - updated_at
        - grants
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        purpose:
          type: string
        fields:
          type: array
          description: 字段名。
          items:
            $ref: '#/components/schemas/CredentialFieldName'
        status:
          $ref: '#/components/schemas/CredentialStatus'
        version:
          type: integer
          description: 当前的内容版本，每次更新加 1。新运行使用领取时的当前版本。
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 所有者在填写时设置的到期时间，不过期时为 null。
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 最近一次被运行领取的时间。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: '#/components/schemas/CredentialGrant'
    CredentialPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Credential'
    GrantCredentialRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: 任务清单中的引用名。同一任务的同一引用名只能绑定一个凭证，已有绑定会被替换。
    NotificationChannelKind:
      type: string
      description: |
        webhook 为通用 webhook，载荷为 NotificationEvent 的 JSON，带 HMAC 签名（见根文件的 webhooks）；
        feishu、slack 为对应机器人的 webhook 地址，平台按它们的消息格式发送同样的内容。
      enum:
        - webhook
        - feishu
        - slack
    NotificationEventType:
      type: string
      description: |
        可以订阅的事件。run_failed 执行失败；run_timed_out 已超时；run_interrupted 运行中断；
        credential_expiring 订阅范围内任务引用的凭证将在 7 天内到期。测试运行不发通知。
      enum:
        - run_failed
        - run_timed_out
        - run_interrupted
        - credential_expiring
    NotificationSubscriptionInput:
      type: object
      description: 订阅一个项目的全部任务，或其中一个任务。
      required:
        - project_id
        - events
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: 只订阅这个任务。省略时订阅整个项目。
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationEventType'
    NotificationSubscription:
      type: object
      required:
        - id
        - project
        - task
        - events
      properties:
        id:
          type: string
          format: uuid
        project:
          $ref: '#/components/schemas/ProjectRef'
        task:
          description: 订阅的任务，订阅整个项目时为 null。
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEventType'
    NotificationDeliveryStatus:
      type: string
      description: pending 等待发送或重试；delivered 已送达（对方返回 2xx）；failed 重试用尽仍失败。
      enum:
        - pending
        - delivered
        - failed
    NotificationDelivery:
      type: object
      description: 一次通知的发送记录。
      required:
        - id
        - event_type
        - status
        - attempts
        - http_status
        - error
        - task
        - run_id
        - merged_count
        - created_at
        - last_attempt_at
        - delivered_at
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          description: NotificationEventType 的取值，或测试通知的 `test`。
        status:
          $ref: '#/components/schemas/NotificationDeliveryStatus'
        attempts:
          type: integer
        http_status:
          type:
            - integer
            - 'null'
          description: 最近一次尝试时对方返回的状态码，连接失败时为 null。
        error:
          type:
            - string
            - 'null'
          description: 最近一次失败的原因，例如超时、连接被拒绝。
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        run_id:
          type:
            - string
            - 'null'
          format: uuid
        merged_count:
          type: integer
          description: 合并进这条通知的事件数。同一任务连续失败时合并发送，避免刷屏。
        created_at:
          type: string
          format: date-time
        last_attempt_at:
          type:
            - string
            - 'null'
          format: date-time
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
    NotificationDeliveryPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDelivery'
    NotificationChannel:
      type: object
      description: 当前用户的一个通知渠道和它的订阅。目标地址可能含有机器人令牌，只返回打码后的形式。
      required:
        - id
        - name
        - kind
        - enabled
        - url_preview
        - subscriptions
        - last_delivery
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/NotificationChannelKind'
        enabled:
          type: boolean
        url_preview:
          type: string
          description: 打码后的目标地址，只保留协议、主机和末尾几个字符。
          examples:
            - https://open.feishu.cn/…/a91c
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSubscription'
        last_delivery:
          description: 最近一次发送，没有时为 null。
          oneOf:
            - $ref: '#/components/schemas/NotificationDelivery'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationChannelList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
    CreatedNotificationChannel:
      type: object
      description: 新建的通知渠道。webhook 类型带签名密钥，只出现这一次。
      required:
        - channel
        - signing_secret
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        signing_secret:
          type:
            - string
            - 'null'
          description: webhook 签名用的密钥，接收方用它校验 `X-Lerryn-Signature`。只出现这一次；feishu 和 slack 为 null。
    CreateNotificationChannelRequest:
      type: object
      required:
        - name
        - kind
        - url
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: '#/components/schemas/NotificationChannelKind'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: 目标地址，http 或 https。加密保存，之后只返回打码后的形式。
        enabled:
          type: boolean
          default: true
        subscriptions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NotificationSubscriptionInput'
    UpdateNotificationChannelRequest:
      type: object
      description: 要修改的字段。subscriptions 给出时整体替换。
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        url:
          type: string
          format: uri
          maxLength: 2048
        enabled:
          type: boolean
        subscriptions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NotificationSubscriptionInput'
    NotificationEventKind:
      type: string
      description: 通知载荷中的事件类别：NotificationEventType 的取值，加上测试通知 test。
      enum:
        - run_failed
        - run_timed_out
        - run_interrupted
        - credential_expiring
        - test
    NotificationRun:
      type: object
      required:
        - id
        - status
        - error_code
        - reason
        - version
        - attempt
        - link
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        error_code:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
        reason:
          type:
            - string
            - 'null'
          description: 脱敏后的简要原因，不超过 200 个字符。
        version:
          type: integer
        attempt:
          type: integer
        link:
          type: string
          format: uri
          description: 运行详情页。
    NotificationCredential:
      type: object
      required:
        - id
        - name
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expires_at:
          type: string
          format: date-time
    NotificationEvent:
      type: object
      description: |
        通用 webhook 通知的载荷。内容只有任务名、实际状态、错误类别、脱敏后的简要原因和控制台链接，不含凭证、日志或参数。
      required:
        - id
        - type
        - occurred_at
        - project
        - task
        - run
        - credential
        - merged_count
        - link
      properties:
        id:
          type: string
          format: uuid
          description: 通知 ID，与请求头 `X-Lerryn-Delivery` 相同。重试时不变，接收方可以据此去重。
        type:
          $ref: '#/components/schemas/NotificationEventKind'
        occurred_at:
          type: string
          format: date-time
        project:
          $ref: '#/components/schemas/ProjectRef'
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        run:
          description: 运行相关的事件为最近一次运行，其他为 null。
          oneOf:
            - $ref: '#/components/schemas/NotificationRun'
            - type: 'null'
        credential:
          description: credential_expiring 时为将要到期的凭证，其他为 null。
          oneOf:
            - $ref: '#/components/schemas/NotificationCredential'
            - type: 'null'
        merged_count:
          type: integer
          minimum: 1
          description: 合并进这条通知的事件数。大于 1 表示同一任务连续失败了这么多次，只发这一条。
        link:
          type: string
          format: uri
          description: 控制台中处理这件事的页面。
    RunnerStatus:
      type: string
      description: online 在线；offline 失联（超过租约时间没有心跳）；disabled 已被管理员停用，不再领取新运行。
      enum:
        - online
        - offline
        - disabled
    Runner:
      type: object
      description: 一个执行节点。
      required:
        - id
        - name
        - labels
        - status
        - slots
        - running
        - version
        - last_seen_at
        - disabled_at
        - created_at
      properties:
        id:
          type: string
          description: runner 第一次启动时生成的稳定 ID。
        name:
          type: string
        labels:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/RunnerStatus'
        slots:
          type: integer
          description: 同时执行的运行数上限。
        running:
          type: integer
          description: 当前领取且未结束的运行数。
        version:
          type:
            - string
            - 'null'
          description: runner 的发行版本，内嵌 runner 与 server 相同。
        last_seen_at:
          type: string
          format: date-time
        disabled_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    RunnerPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Runner'
    UpdateRunnerRequest:
      type: object
      required:
        - disabled
      additionalProperties: false
      properties:
        disabled:
          type: boolean
          description: true 停用：不再领取新运行，正在执行的运行继续。false 恢复。
    CreateRunnerTokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
          description: 备注，例如准备部署的机器。
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 24
          description: 注册令牌多少小时后失效。
    RunnerToken:
      type: object
      description: runner 注册令牌。runner 用它换取自己的凭证，令牌只能用一次。
      required:
        - id
        - token
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: 令牌本身，只出现这一次。
        expires_at:
          type: string
          format: date-time
    AdminUser:
      type: object
      description: 管理员看到的一个账号。
      required:
        - id
        - username
        - display_name
        - email
        - is_admin
        - has_password
        - sso
        - disabled_at
        - created_at
        - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        is_admin:
          type: boolean
        has_password:
          type: boolean
          description: 是否设置了内置账号密码。
        sso:
          type: boolean
          description: 是否关联了单点登录身份。
        disabled_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 停用时间。停用的账号不能登录，它的会话、访问令牌和设备会话立即失效。
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 最近一次用会话或访问令牌访问的时间，精确到分钟左右。
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
    AdminCreateUserRequest:
      type: object
      description: 管理员建立内置账号。开放注册关闭时也可以建立。
      required:
        - username
        - password
      additionalProperties: false
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        display_name:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
        is_admin:
          type: boolean
          default: false
    AdminUpdateUserRequest:
      type: object
      description: |
        修改账号。只修改给出的字段。不能停用自己，也不能取消自己的管理员身份，避免部署失去管理员。
      minProperties: 1
      additionalProperties: false
      properties:
        is_admin:
          type: boolean
        disabled:
          type: boolean
          description: true 停用，false 恢复。
        display_name:
          type: string
          maxLength: 64
    AdminResetPasswordRequest:
      type: object
      required:
        - password
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/Password'
    OidcInfo:
      type: object
      description: 配置文件中的单点登录设置，只读。client secret 不返回。
      required:
        - issuer
        - client_id
        - username_claim
        - callback_url
        - user_count
      properties:
        issuer:
          type: string
        client_id:
          type: string
        username_claim:
          type: string
          description: 用作用户名的声明，默认 `preferred_username`。
        callback_url:
          type: string
          format: uri
          description: 需要在 OIDC 提供方登记的回调地址。
        user_count:
          type: integer
          description: 关联了单点登录身份的账号数。
    Settings:
      type: object
      description: 部署级设置（技术设计第 12.1 节）。可修改的项存在数据库中，修改立即生效。
      required:
        - open_registration
        - local_password_login
        - require_test_before_activate
        - oidc
        - updated_at
        - updated_by
      properties:
        open_registration:
          type: boolean
          description: 是否开放注册。关闭后新账号只能由管理员建立，或通过单点登录首次登录产生。
        local_password_login:
          type: boolean
          description: |
            普通用户能否用内置账号密码登录。只有配置了单点登录时才能关闭；关闭后管理员仍可用密码登录，供应急使用。
        require_test_before_activate:
          type: boolean
          description: 激活前必须测试。来自部署配置，这里只读。
        oidc:
          description: 单点登录设置，没有配置时为 null。
          oneOf:
            - $ref: '#/components/schemas/OidcInfo'
            - type: 'null'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 最近一次修改的时间，从未修改时为 null。
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
    UpdateSettingsRequest:
      type: object
      description: 要修改的设置。只修改给出的字段。
      minProperties: 1
      additionalProperties: false
      properties:
        open_registration:
          type: boolean
        local_password_login:
          type: boolean
    AuditActor:
      type: object
      description: 审计记录的操作者。
      required:
        - kind
        - id
        - name
      properties:
        kind:
          type: string
          enum:
            - user
            - token
            - runner
            - trigger
            - anonymous
            - system
          description: token 表示用访问令牌操作，`id` 为令牌所属的用户，`name` 为令牌名。
        id:
          type:
            - string
            - 'null'
          description: 用户 ID、runner ID 或触发器 ID。匿名和系统操作为 null。
        name:
          type:
            - string
            - 'null'
          description: 记录时的用户名、令牌名或 runner 名。
    AuditEvent:
      type: object
      description: 一条审计记录（技术设计第 12.7 节）。不含任何明文凭证。
      required:
        - id
        - ts
        - actor
        - action
        - kind
        - resource_kind
        - resource_id
        - result
        - via
        - tool
        - ip
        - request_id
        - details
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: 操作，通常为 operationId，例如 `setTaskActivation`；平台内部的动作用点分名称，例如 `runner.claim`。
        kind:
          type:
            - string
            - 'null'
          enum:
            - read
            - mutate
            - execute
          description: 操作的 x-operation-kind。
        resource_kind:
          type: string
          description: 资源类别，例如 task、credential、user、setting。
        resource_id:
          type:
            - string
            - 'null'
        result:
          type: string
          enum:
            - success
            - failure
            - denied
        via:
          type:
            - string
            - 'null'
          enum:
            - api
            - mcp
            - console
            - runner
            - hook
          description: 入口。经 MCP 的操作为 mcp，`tool` 为工具名。
        tool:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
        request_id:
          type:
            - string
            - 'null'
        details:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: 与操作相关的补充信息，例如角色变化前后的值。
    AuditEventPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEvent'
    TaskTag:
      type: string
      minLength: 1
      maxLength: 40
      description: 用于分类的标签名。区分大小写，首尾不能有空白，不允许控制字符或换行。
      examples:
        - 日报
        - CRM
    TaskTags:
      type: array
      description: 任务的分类标签，最多 20 个。响应中按标签名排序，没有标签时为空数组。
      maxItems: 20
      uniqueItems: true
      items:
        $ref: '#/components/schemas/TaskTag'
    TaskTagSet:
      type: object
      additionalProperties: false
      required:
        - tags
      properties:
        tags:
          $ref: '#/components/schemas/TaskTags'
