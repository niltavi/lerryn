webhooks:
  notification:
    post:
      operationId: deliverNotification
      tags:
        - notifications
      summary: 通知
      description: |
        通用 webhook 通知渠道收到的请求（技术设计第 14 节）。请求头：

        - `X-Lerryn-Event`：事件类别，与载荷的 `type` 相同。
        - `X-Lerryn-Delivery`：通知 ID，与载荷的 `id` 相同，重试时不变。
        - `X-Lerryn-Signature`：`t=<Unix 秒>,v1=<十六进制签名>`，签名为 HMAC-SHA256(签名密钥, `<t>.<请求体>`)。
          接收方应校验签名，并拒绝 `t` 与当前时间相差超过 5 分钟的请求。

        接收方返回 2xx 视为送达；其他状态码或超过 10 秒未响应视为失败，按 1 分钟、5 分钟、30 分钟重试 3 次。
        飞书和 Slack 渠道发送的是各自的消息格式，内容与这里相同，不带签名头。
      x-operation-kind: mutate
      x-mcp:
        expose: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationEvent'
      responses:
        '200':
          description: 已收到。2xx 都视为送达。
        default:
          $ref: '#/components/responses/Problem'
components:
  headers:
    SessionCookie:
      description: |
        会话 cookie `lerryn_session`，HttpOnly、SameSite=Lax，部署地址为 https 时带 Secure。
        登出时以过期的 cookie 清除。
      schema:
        type: string
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: wl_pat_<随机串>
      description: |
        访问令牌，供 Agent 和 CLI 使用。用户在控制台创建，只在创建时显示一次。
        令牌代表创建它的用户，实际权限是用户权限与令牌范围（read、write、execute）的交集。
        操作需要的范围由 `x-operation-kind` 决定：read 需要 read，mutate 需要 write，execute 需要 execute。
    sessionCookie:
      type: apiKey
      in: cookie
      name: lerryn_session
      description: |
        Web 控制台和移动端的登录会话，HttpOnly、SameSite=Lax。写操作还会校验 `Origin`。
        移动端的设备会话只有 read 范围。Agent 不使用会话。
    triggerToken:
      type: http
      scheme: bearer
      bearerFormat: wl_hook_<随机串>
      description: |
        webhook 触发器的令牌，只能用于 `POST /hooks/{triggerId}`，每个触发器一个，可以单独轮换。
        它不代表任何用户，不能调用其他接口。
  parameters:
    Limit:
      name: limit
      in: query
      description: 每页返回的条数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 上一页响应中的 `next_cursor`。省略时从第一页开始。
      schema:
        type: string
        maxLength: 1024
    TaskID:
      name: taskId
      in: path
      required: true
      description: 任务 ID。
      schema:
        type: string
        format: uuid
    RunID:
      name: runId
      in: path
      required: true
      description: 运行 ID。
      schema:
        type: string
        format: uuid
    ProjectID:
      name: projectId
      in: path
      required: true
      description: 项目 ID。
      schema:
        type: string
        format: uuid
    VersionSeq:
      name: seq
      in: path
      required: true
      description: 任务的版本号，从 1 开始。
      schema:
        type: integer
        minimum: 1
    TriggerID:
      name: triggerId
      in: path
      required: true
      description: 触发器 ID。
      schema:
        type: string
        format: uuid
    ArtifactID:
      name: artifactId
      in: path
      required: true
      description: 产物 ID。
      schema:
        type: string
        format: uuid
    CredentialID:
      name: credentialId
      in: path
      required: true
      description: 凭证 ID。
      schema:
        type: string
        format: uuid
    CredentialRequestID:
      name: requestId
      in: path
      required: true
      description: 凭证填写请求的 ID。
      schema:
        type: string
        format: uuid
    UserID:
      name: userId
      in: path
      required: true
      description: 用户 ID。
      schema:
        type: string
        format: uuid
    ChannelID:
      name: channelId
      in: path
      required: true
      description: 通知渠道 ID。
      schema:
        type: string
        format: uuid
    RunnerID:
      name: runnerId
      in: path
      required: true
      description: 执行节点 ID。由 runner 自己生成，不是 UUID。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DeviceID:
      name: deviceId
      in: path
      required: true
      description: 移动设备会话的 ID。
      schema:
        type: string
        format: uuid
    ProjectFilter:
      name: project_id
      in: query
      description: 只返回这个项目中的数据。省略时返回调用者能查看的全部项目。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      description: |
        调用者读到的版本号，用于防止覆盖其他会话的修改。与服务端当前版本不一致时返回 412 `version_conflict`，
        `Problem.current_version` 给出当前版本号。可以写成 `3` 或 `"3"`。
      schema:
        type: string
        pattern: ^"?[0-9]{1,10}"?$
        examples:
          - '3'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        幂等键，1 到 128 个可见 ASCII 字符，建议用 UUID。24 小时内用相同的键和相同的请求重试，返回首次的结果，不会重复执行；
        相同的键对应不同的请求时返回 409 `idempotency_conflict`。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x7E]+$
    DryRun:
      name: dry_run
      in: query
      description: 为 true 时只校验并返回预览，不保存任何修改。
      schema:
        type: boolean
        default: false
    Since:
      name: since
      in: query
      description: 只返回这个时间及之后的记录。
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      description: 只返回这个时间之前的记录。
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: 错误。结构见 `Problem`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        错误详情，遵循 RFC 9457（problem details），所有错误响应都以 `application/problem+json` 返回。
        在标准字段之外扩展了 `code`、`next_actions`、`request_id`，校验失败时另带 `errors`。
        Agent 按 `code` 判断错误类别，按 `next_actions` 决定下一步，不解析 `title` 和 `detail` 的文字。
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri-reference
          description: 错误类型 URI，固定为 `urn:lerryn:error:<code>`。
          examples:
            - urn:lerryn:error:credential_missing
        title:
          type: string
          description: 错误类别的简短说明。同一个 code 的 title 不变。
          examples:
            - 缺少凭证
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP 状态码，与响应状态一致。
        detail:
          type: string
          description: 本次错误的具体说明，面向人和 Agent 阅读，不用于程序判断。
          examples:
            - 任务引用的凭证 LLM_API_KEY 尚未填写
        instance:
          type: string
          format: uri-reference
          description: 出错的请求路径。
        code:
          $ref: '#/components/schemas/ErrorCode'
        next_actions:
          type: array
          description: 建议的下一步，按优先级排列。没有建议时省略。
          items:
            $ref: '#/components/schemas/NextAction'
        request_id:
          type: string
          description: 本次请求的 ID，与响应头 `X-Request-Id` 相同。
          examples:
            - req_7FZ2CQ4M3XKJ6N5W2Y4T3A6B
        errors:
          type: array
          description: 字段级错误，仅在 `code` 为 `validation_failed` 时出现。
          items:
            $ref: '#/components/schemas/FieldError'
        current_version:
          type: integer
          description: 资源当前的版本号，仅在 `code` 为 `version_conflict` 时出现。读取这个版本和差异后再重新提交。
    ErrorCode:
      type: string
      description: |
        稳定的错误类别。HTTP 错误的 `Problem.code` 和运行失败的错误类别共用这一组值。
      oneOf:
        - title: ValidationFailed
          const: validation_failed
          description: 清单或参数校验失败。下一步：按 `errors` 字段修正后重新提交。
        - title: VersionConflict
          const: version_conflict
          description: 任务已被其他会话修改。下一步：读取最新版本和差异后重新提交，不要覆盖其他会话的修改。
        - title: IdempotencyConflict
          const: idempotency_conflict
          description: 同一幂等键对应了不同的请求。下一步：换新的幂等键，或按原请求重试。
        - title: CredentialMissing
          const: credential_missing
          description: 引用的凭证不存在或尚未填写。下一步：创建凭证填写请求，把链接交给用户。
        - title: CredentialUnavailable
          const: credential_unavailable
          description: 凭证已撤销、过期，或未授权给该任务。下一步：请凭证所有者更新或授权。
        - title: DependencyInstallFailed
          const: dependency_install_failed
          description: 依赖安装失败。下一步：查看准备阶段的日志，修正锁文件。
        - title: RunnerUnavailable
          const: runner_unavailable
          description: 没有满足标签要求的在线 runner。下一步：联系管理员，或调整 runner_labels。
        - title: QueueFull
          const: queue_full
          description: 队列已满。下一步：稍后重试。
        - title: ScriptError
          const: script_error
          description: 脚本以非 0 状态退出。下一步：查看日志和失败的阶段。
        - title: Timeout
          const: timeout
          description: 超过执行时限。下一步：优化脚本，或调整 limits.timeout。
        - title: RegistrationDisabled
          const: registration_disabled
          description: 管理员已关闭开放注册。下一步：联系管理员创建账号，或使用单点登录。
        - title: InsufficientScope
          const: insufficient_scope
          description: 访问令牌的范围不足。下一步：换用范围足够的令牌。
        - title: NotFound
          const: not_found
          description: 资源不存在或无权访问。下一步：确认 ID 和权限。
        - title: Unauthenticated
          const: unauthenticated
          description: 缺少有效的访问令牌或会话。下一步：在 Authorization 头中提供有效的访问令牌。
        - title: UsernameTaken
          const: username_taken
          description: 用户名已被占用，不区分大小写。下一步：换一个用户名。
        - title: RateLimited
          const: rate_limited
          description: 短时间内请求过多，例如连续登录失败。下一步：等待一分钟后再试。
        - title: RunInProgress
          const: run_in_progress
          description: 任务的清单为 concurrency forbid，上一个运行还没有结束。下一步：用 run_get 等它结束，或用 run_cancel 取消后再发起。
        - title: OutOfMemory
          const: out_of_memory
          description: 任务进程超出内存上限被杀死。只出现在运行的错误类别中。下一步：降低内存占用，或调大 limits.memory。
        - title: RunInterrupted
          const: run_interrupted
          description: 运行进行中时 runner 重启或失联，运行被中断，容器已停止。只出现在运行的错误类别中。下一步：查看已保留的日志，确认脚本可以重复执行后重新发起运行。
        - title: OriginNotAllowed
          const: origin_not_allowed
          description: 用会话发起的写操作缺少 Origin 头，或 Origin 与部署地址不一致。下一步：从控制台页面发起请求；Agent 和脚本请改用访问令牌。
        - title: InternalError
          const: internal_error
          description: 服务端内部错误。下一步：稍后重试；持续出现时把 request_id 交给管理员。
        - title: PermissionDenied
          const: permission_denied
          description: 能查看资源，但当前用户在项目中的角色不允许这个操作，或操作只对管理员开放。下一步：请项目所有者调整角色，或请管理员处理。
        - title: PreconditionRequired
          const: precondition_required
          description: 修改已有资源时缺少 If-Match。下一步：读取资源，把读到的版本号放进 If-Match（MCP 参数 if_match）后重新提交。
        - title: VersionNotTested
          const: version_not_tested
          description: 部署要求激活前必须测试，而这个版本还没有成功的测试运行。下一步：用 run_start 带 test 为 true 测试这个版本，检查结果后再激活。
        - title: TaskArchived
          const: task_archived
          description: 任务已归档，不能再运行或修改。下一步：用同一个任务名重新提交，会建立一个新任务。
        - title: PasswordLoginDisabled
          const: password_login_disabled
          description: 管理员已关闭普通用户的本地密码登录。下一步：使用单点登录。
        - title: LastOwner
          const: last_owner
          description: 项目至少要有一个所有者，不能移除或降级最后一个所有者。下一步：先把其他成员设为所有者。
        - title: RequestClosed
          const: request_closed
          description: 凭证填写请求已经填写过、过期或被取消，不能再提交。下一步：用 getCredentialRequest 查看状态；还需要填写时重新发起请求。
        - title: Expired
          const: expired
          description: 日志或产物已按部署的保留策略清理，内容不再可读；运行记录仍在。下一步：需要这些内容时重新运行任务，不要反复读取。
        - title: ManualRunDisabled
          const: manual_run_disabled
          description: 任务关闭了控制台的手动执行，从控制台会话发起的运行被拒绝。访问令牌发起的运行不受影响。下一步：需要从控制台运行时，请 Agent 用 setTaskConsole 打开手动执行。
        - title: AIProviderError
          const: ai_provider_error
          description: 模型服务未返回可用的文本。下一步：检查 AI 配置和服务商状态。
    NextAction:
      type: object
      description: 一条建议的下一步操作。
      required:
        - action
        - hint
      properties:
        action:
          type: string
          description: 建议调用的操作，取 MCP 工具名（例如 `credential_request`）或 operationId。
          examples:
            - credential_request
        hint:
          type: string
          description: 面向 Agent 的说明。
          examples:
            - 为该任务创建凭证填写请求，并把链接交给用户
    FieldError:
      type: object
      description: |
        一处字段级错误，格式参照 RFC 9457 的示例。通常带 `pointer`、`parameter`、`header` 之一，
        指明出错的位置；三者至多出现一个。
      required:
        - detail
      properties:
        detail:
          type: string
          description: 错误说明。
        pointer:
          type: string
          description: 请求体中的位置，JSON Pointer，以 `#` 开头。
          examples:
            - '#/triggers/0/timezone'
        parameter:
          type: string
          description: 出错的查询参数或路径参数名。
          examples:
            - limit
        header:
          type: string
          description: 出错的请求头名。
          examples:
            - If-Match
    CursorPage:
      type: object
      description: |
        游标分页的公共字段。列表响应用 `allOf` 把本结构和 `items` 组合起来，写法见 api/README.md。
      required:
        - next_cursor
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: 下一页的游标，原样传给下一次请求的 `cursor` 参数。为 null 表示没有更多数据。游标不透明，不要解析或拼接。
    Links:
      type: object
      description: 与资源相关的链接。
      required:
        - console
      properties:
        console:
          type: string
          format: uri
          description: 控制台中对应页面的完整地址，可以直接交给用户打开。
          examples:
            - https://lerryn.example.com/
    TokenScope:
      type: string
      description: |
        访问令牌的范围，与 `x-operation-kind` 一一对应：read 操作需要 read，mutate 操作需要 write，
        execute 操作需要 execute。
      enum:
        - read
        - write
        - execute
    NetworkPolicy:
      type: string
      description: 任务容器的网络策略。none 为无网络；full 可以访问外部网络。
      enum:
        - none
        - full
    TaskRef:
      type: object
      description: 对任务的简短引用，用于列表和关联字段。
      required:
        - id
        - name
        - project_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 任务名。
        project_id:
          type: string
          format: uuid
    ProjectRef:
      type: object
      description: 对项目的简短引用。
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    UserRef:
      type: object
      description: 对用户的简短引用。只包含成员之间本来就能看到的信息。
      required:
        - id
        - username
        - display_name
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type:
            - string
            - 'null'
          description: 显示名，未设置时为 null，客户端改用 username。
    ProjectRole:
      type: string
      description: |
        项目角色（技术设计第 12.2 节）。viewer 查看任务、运行、日志和产物；maintainer 另外可以运行控制、
        修改任务和触发器；owner 另外可以管理成员和项目设置。
      enum:
        - viewer
        - maintainer
        - owner
    Discovery:
      type: object
      description: |
        Agent 接入时读取的平台信息。各字段只做增量扩展，Agent 遇到不认识的字段应忽略。
      required:
        - server
        - api
        - capabilities
        - runtimes
        - skills
        - principal
        - links
      properties:
        server:
          $ref: '#/components/schemas/ServerInfo'
        api:
          $ref: '#/components/schemas/ApiInfo'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        runtimes:
          type: array
          description: 可用的运行时目录。任务清单的 `runtime` 只能从这里选。
          items:
            $ref: '#/components/schemas/RuntimeInfo'
        skills:
          $ref: '#/components/schemas/SkillCatalog'
        principal:
          description: 当前调用者的身份。匿名调用时为 null。
          oneOf:
            - $ref: '#/components/schemas/Principal'
            - type: 'null'
        links:
          $ref: '#/components/schemas/Links'
          description: '`console` 指向控制台首页。'
    EnvironmentInfo:
      type: object
      required:
        - environment
      properties:
        environment:
          type: string
          description: 部署环境。未配置时为 `unspecified`。
          enum:
            - production
            - test
            - staging
            - development
            - unspecified
          examples:
            - production
    ServerInfo:
      type: object
      description: 服务端的构建信息。
      required:
        - version
        - commit
        - build_date
      properties:
        version:
          type: string
          description: 服务端发行版本。本地开发构建为 `dev`。
          examples:
            - v0.9.0
        commit:
          type: string
          description: 构建时的 git 提交，未知时为 `none`。
          examples:
            - 4a78fd0
        build_date:
          type:
            - string
            - 'null'
          format: date-time
          description: 构建时间（UTC）。开发构建没有记录时为 null。
    ApiInfo:
      type: object
      description: 接口契约的版本。
      required:
        - version
        - spec_version
      properties:
        version:
          type: string
          description: API 主版本，对应路径前缀 `/api/<version>`。主版本内只做增量变更。
          examples:
            - v1
        spec_version:
          type: string
          description: 服务端实现的 OpenAPI 契约版本（`info.version`）。
          examples:
            - 0.9.0
    Capabilities:
      type: object
      description: |
        本部署启用的能力。Agent 据此选择操作路径，不要凭记忆假设。
        新能力以新增字段的形式加入。
      required:
        - login_methods
        - registration_open
        - first_account
        - network_policies
        - require_test_before_activate
      properties:
        login_methods:
          type: array
          description: |
            人登录控制台可用的方式。Agent 一律使用访问令牌，不受此项影响。
            管理员关闭本地密码登录后不含 password，此时 admin_password_login 为 true。
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LoginMethod'
        admin_password_login:
          type: boolean
          description: |
            本地密码登录对普通用户关闭、只有管理员还能用密码登录时为 true（技术设计第 12.1 节）。
            控制台据此以单点登录为主入口，另给管理员留一个密码登录的入口；其他情况为 false。
        registration_open:
          type: boolean
          description: 是否开放注册。关闭时新账号只能由管理员创建，或通过单点登录首次登录产生。
        first_account:
          type: boolean
          description: |
            部署中还没有任何账号。此时下一个注册的账号成为管理员，即使开放注册已关闭也可以注册。
            控制台据此在注册页提示首个账号。
        network_policies:
          type: array
          description: 任务清单的 `network` 字段可用的取值。
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NetworkPolicy'
        require_test_before_activate:
          type: boolean
          description: 为 true 时，任务版本必须有一次成功的测试运行才能激活。
    LoginMethod:
      type: string
      description: 控制台登录方式。password 为内置账号的用户名和密码；oidc 为单点登录。
      enum:
        - password
        - oidc
    RuntimeInfo:
      type: object
      description: 运行时目录中的一项。任务清单的 `runtime` 字段按这里的取值填写。
      required:
        - language
        - version
        - lockfile
      properties:
        language:
          type: string
          description: 运行时语言。
          examples:
            - python
        version:
          type: string
          description: 运行时版本。
          examples:
            - '3.12'
        lockfile:
          type:
            - string
            - 'null'
          description: 依赖锁文件名。不支持依赖管理的运行时为 null。
          examples:
            - uv.lock
    SkillCatalog:
      type: object
      description: 与服务端版本匹配的 Skill。
      required:
        - version
        - items
      properties:
        version:
          type: string
          description: |
            服务端提供的 Skill 版本，随服务端发行。Agent 本地 Skill 的版本与它不同时，
            从服务端重新获取 Skill。
          examples:
            - v0.9.0
        items:
          type: array
          description: 服务端提供的 Skill 列表。
          items:
            $ref: '#/components/schemas/SkillSummary'
    SkillSummary:
      type: object
      description: 一个 Skill 的摘要。
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: Skill 名称。
          examples:
            - lerryn-automation
        description:
          type: string
          description: Skill 的触发场景说明，即 SKILL.md 中的 description。
    ToolKind:
      type: string
      description: |
        工具类型：http 为 HTTP API，mcp 为外部 MCP 服务，script 为脚本工具（一组文件，引用它的任务运行时以只读方式挂载）。
      enum:
        - http
        - mcp
        - script
    Tool:
      type: object
      description: 项目中登记的一个工具。
      required:
        - id
        - project_id
        - name
        - kind
        - description
        - url
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: 项目内唯一的工具名，任务清单的 `tools` 按它引用。
          examples:
            - crm-mcp
        kind:
          $ref: '#/components/schemas/ToolKind'
        description:
          type: string
          description: 工具的用途、主要接口和需要的凭证，供 Agent 判断是否使用。
        url:
          type: string
          description: 工具的地址，运行时交给任务。script 工具为空字符串。
          examples:
            - https://crm.example.com/mcp
        files:
          type: array
          description: script 工具的文件，不含内容；其他类型省略。
          items:
            $ref: '#/components/schemas/TaskFile'
        tree_hash:
          type: string
          description: script 工具全部文件的 SHA-256 摘要，与任务版本的 tree_hash 算法相同；运行日志记录挂载的是哪一份。其他类型省略。
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ToolList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    RegisterToolRequest:
      type: object
      description: |
        http 和 mcp 工具需要 `url`，不能带 `files`；script 工具需要 `files`，不能带 `url`。
        script 工具的文件规则与任务文件相同：最多 100 个，总大小不超过 1 MiB。
      required:
        - name
        - kind
        - description
      additionalProperties: false
      properties:
        name:
          type: string
          description: 工具名：小写字母、数字和连字符，以字母或数字开头。
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          examples:
            - crm-mcp
        kind:
          $ref: '#/components/schemas/ToolKind'
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: 工具的用途、主要接口和需要的凭证。
        url:
          type: string
          format: uri
          maxLength: 2048
          description: http 或 https 地址，不含用户名和密码。script 工具不填。
        files:
          type: array
          minItems: 1
          maxItems: 100
          description: script 工具的全部文件。再次登记时整体替换。
          items:
            $ref: '#/components/schemas/TaskFileInput'
    SkillList:
      type: object
      description: 服务端随版本发行的 Skill。
      required:
        - version
        - items
      properties:
        version:
          type: string
          description: Skill 的版本，即服务端版本。
          examples:
            - v0.9.0
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillInfo'
    SkillInfo:
      type: object
      description: 一个 Skill 及其文件清单。
      required:
        - name
        - description
        - files
      properties:
        name:
          type: string
          description: Skill 名称，也是安装时的目录名。
          examples:
            - lerryn-automation
        description:
          type: string
          description: Skill 的触发场景说明，即 SKILL.md 中的 description。
        files:
          type: array
          description: Skill 目录下的文件，相对路径，以 / 分隔，按路径排序；包含 SKILL.md。
          items:
            type: string
          examples:
            - - SKILL.md
              - references/manifest.md
    Skill:
      type: object
      description: 一个 Skill 的全部内容。
      required:
        - name
        - description
        - version
        - files
      properties:
        name:
          type: string
          examples:
            - lerryn-automation
        description:
          type: string
          description: SKILL.md 中的 description。
        version:
          type: string
          description: Skill 的版本，即服务端版本。
        files:
          type: array
          description: Skill 目录下的全部文件，按路径排序。
          items:
            $ref: '#/components/schemas/SkillFile'
    SkillFile:
      type: object
      description: Skill 的一个文件。
      required:
        - path
        - content
      properties:
        path:
          type: string
          description: 相对 Skill 目录的路径，以 / 分隔。
          examples:
            - references/manifest.md
        content:
          type: string
          description: 文件内容，UTF-8 文本。
    Principal:
      type: object
      description: 当前调用者。访问令牌代表创建它的用户。
      required:
        - user_id
        - username
        - display_name
        - is_admin
        - auth_method
        - scopes
        - personal_project_id
      properties:
        user_id:
          type: string
          format: uuid
          description: 用户 ID。
        personal_project_id:
          type: string
          format: uuid
          description: 当前用户个人项目的 ID。建立任务时用它作为 project_id。
        username:
          type: string
          description: 用户名。
        display_name:
          type:
            - string
            - 'null'
          description: 显示名，未设置时为 null。
        is_admin:
          type: boolean
          description: 是否为平台管理员。
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        scopes:
          type: array
          description: 本次请求的有效范围。会话拥有全部范围；访问令牌为创建时选择的范围。
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TokenScope'
    AuthMethod:
      type: string
      description: 本次请求的鉴权方式。access_token 为访问令牌；session 为控制台或移动端的会话。
      enum:
        - access_token
        - session
    RegisterRequest:
      type: object
      description: 注册内置账号。只有用户名和密码是必填的。
      required:
        - username
        - password
      additionalProperties: false
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        display_name:
          type: string
          maxLength: 64
          description: 显示名，可选。
        email:
          type: string
          format: email
          maxLength: 254
          description: 邮箱，可选，不做验证。
    LoginRequest:
      type: object
      description: 用密码登录。
      required:
        - username
        - password
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
          description: 用户名，不区分大小写。
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: 密码。
        device:
          $ref: '#/components/schemas/DeviceInfo'
          description: 移动端登录时给出。带这一项时建立只读的设备会话，而不是 Web 会话。
    DeviceInfo:
      type: object
      description: 移动设备的信息，显示在个人设置的设备列表中。
      required:
        - name
        - platform
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 设备名，例如“张林的 iPhone”。
        platform:
          type: string
          enum:
            - ios
            - android
            - other
        os_version:
          type: string
          maxLength: 32
          description: 系统版本，例如 `iOS 26.1`。
    PairingCode:
      type: object
      description: 一次性的移动端配对码。
      required:
        - code
        - uri
        - expires_at
      properties:
        code:
          type: string
          description: 配对码，8 个字符，也可以手动输入。
          examples:
            - K7Q2XN4V
        uri:
          type: string
          description: 二维码的内容：`lerryn://pair?server=<部署地址>&code=<配对码>`。
        expires_at:
          type: string
          format: date-time
    ExchangePairingRequest:
      type: object
      required:
        - server
        - code
        - device
      additionalProperties: false
      properties:
        server:
          type: string
          format: uri
          description: 二维码中的部署地址，服务端核对它与自己的 `server.public_url` 一致。
        code:
          type: string
          minLength: 1
          maxLength: 16
        device:
          $ref: '#/components/schemas/DeviceInfo'
    Username:
      type: string
      description: |
        用户名：2 到 32 个字符，只能包含 ASCII 字母、数字、点、下划线和连字符，以字母或数字开头。
        不区分大小写，注册后不能修改。
      minLength: 2
      maxLength: 32
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,31}$
      examples:
        - alice
    Password:
      type: string
      description: 密码，至少 8 个字符。不要求包含特定种类的字符。
      minLength: 8
      maxLength: 256
    Me:
      type: object
      description: 当前登录的用户。
      required:
        - id
        - username
        - display_name
        - email
        - is_admin
        - personal_project_id
        - created_at
        - locale
        - timezone
        - has_password
        - identities
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID。
        username:
          type: string
          description: 用户名。
        display_name:
          type:
            - string
            - 'null'
          description: 显示名，未设置时为 null。
        email:
          type:
            - string
            - 'null'
          description: 邮箱，未设置时为 null。
        is_admin:
          type: boolean
          description: 是否为平台管理员。
        personal_project_id:
          type: string
          format: uuid
          description: 个人项目的 ID。
        created_at:
          type: string
          format: date-time
          description: 注册时间。
        locale:
          type:
            - string
            - 'null'
          enum:
            - zh-CN
            - en
          description: 界面语言，未设置时为 null，客户端按浏览器或系统语言选择。
        timezone:
          type:
            - string
            - 'null'
          description: 显示时间用的 IANA 时区，未设置时为 null，客户端用设备时区。
        has_password:
          type: boolean
          description: 是否设置了内置账号密码。只用单点登录的用户为 false，不能修改密码。
        identities:
          type: array
          description: 关联的单点登录身份。
          items:
            $ref: '#/components/schemas/IdentityInfo'
    IdentityInfo:
      type: object
      description: 一个关联的 OIDC 身份。
      required:
        - issuer
        - username
        - linked_at
      properties:
        issuer:
          type: string
          description: OIDC 提供方的 issuer。
        username:
          type:
            - string
            - 'null'
          description: 提供方给出的 preferred_username。
        linked_at:
          type: string
          format: date-time
    AccessToken:
      type: object
      description: 一个访问令牌的元信息。令牌本身只在创建时返回一次。
      required:
        - id
        - name
        - prefix
        - scopes
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
          description: 令牌 ID。
        name:
          type: string
          description: 创建时起的名字，用来区分不同的 Agent 或机器。
        prefix:
          type: string
          description: 令牌的前几个字符，用来辨认是哪一个令牌。
          examples:
            - wl_pat_k7q2
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TokenScope'
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 到期时间，null 表示不过期。
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 最近一次使用的时间，精确到分钟左右。从未使用时为 null。
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 撤销时间，未撤销时为 null。
    AccessTokenPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AccessToken'
    CreateTokenRequest:
      type: object
      description: 创建访问令牌。
      required:
        - name
        - scopes
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 令牌的名字，例如所在的机器或 Agent。
          examples:
            - laptop-claude-code
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          description: 令牌的范围。只做查看用的 Agent 给 read 即可；要建立和运行任务需要 write 和 execute。
          items:
            $ref: '#/components/schemas/TokenScope'
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: 多少天后到期，省略表示不过期。
    CreatedToken:
      type: object
      description: 新创建的访问令牌，包含令牌本身。
      required:
        - token
        - access_token
      properties:
        token:
          type: string
          description: 令牌本身，形如 `wl_pat_...`。只出现这一次，请立即保存。
        access_token:
          $ref: '#/components/schemas/AccessToken'
    UpdateMeRequest:
      type: object
      description: 要修改的个人信息。省略的字段不变，空字符串表示清除。
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 254
          description: 邮箱，不做验证。空字符串表示清除。
        locale:
          type: string
          enum:
            - ''
            - zh-CN
            - en
          description: 界面语言。空字符串表示清除，由客户端自行选择。
        timezone:
          type: string
          maxLength: 64
          description: IANA 时区名，例如 `Asia/Shanghai`。空字符串表示清除。
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          $ref: '#/components/schemas/Password'
    Device:
      type: object
      description: 一个已登录的移动设备。
      required:
        - id
        - name
        - platform
        - os_version
        - created_at
        - last_seen_at
        - expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum:
            - ios
            - android
            - other
        os_version:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
          description: 配对或登录的时间。
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: 是否为发出本次请求的设备。
    DeviceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    Project:
      type: object
      description: 项目：共享和授权的单位。每个用户有一个个人项目。
      required:
        - id
        - name
        - is_personal
        - role
        - owner
        - member_count
        - created_at
        - updated_at
        - links
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_personal:
          type: boolean
          description: 是否为某个用户的个人项目。个人项目不能删除，也不能移除它的所有者。
        role:
          $ref: '#/components/schemas/ProjectRole'
          description: 调用者在这个项目中的角色。
        owner:
          $ref: '#/components/schemas/UserRef'
          description: 建立项目的用户。
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          $ref: '#/components/schemas/Links'
    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'
    ProjectName:
      type: string
      minLength: 1
      maxLength: 64
      description: 项目名称。
    CreateProjectRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/ProjectName'
    UpdateProjectRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/ProjectName'
    Member:
      type: object
      description: 项目的一个成员。
      required:
        - user
        - role
        - disabled
        - created_at
        - updated_at
      properties:
        user:
          $ref: '#/components/schemas/UserRef'
        role:
          $ref: '#/components/schemas/ProjectRole'
        disabled:
          type: boolean
          description: 账号已被管理员停用。停用的成员保留角色，但不能登录。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    SetMemberRequest:
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    UserRefPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserRef'
    TaskName:
      type: string
      description: 任务名：1 到 63 个字符，只能包含小写字母、数字和连字符，以字母或数字开头。在项目内唯一。
      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
      examples:
        - weekday-digest
    Manifest:
      type: object
      description: |
        任务清单（技术设计第 5.3 节）：运行时、入口、参数、阶段、资源限制、网络、并发、凭证、工具、
        runner 标签、自动重试、副作用声明和 Agent 面板。触发器不在清单里，用 setTriggers 单独维护，
        修改触发频率不产生新版本。
      required:
        - runtime
        - entrypoint
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 500
          description: 任务用途，给人看。
        runtime:
          $ref: '#/components/schemas/RuntimeSpec'
        entrypoint:
          type: array
          minItems: 1
          maxItems: 32
          description: 进程的 argv，工作目录为任务文件所在的 `/sbx/task`。
          items:
            type: string
            minLength: 1
            maxLength: 1024
          examples:
            - - python
              - main.py
        params:
          type: object
          additionalProperties: true
          description: 默认参数。运行时以 JSON 放在环境变量 `LERRYN_PARAMS` 中；发起运行时可以整体替换。
        stages:
          type: array
          maxItems: 50
          description: 声明的阶段。任务用 `sbx stage` 上报进度时，控制台按这里的顺序显示。
          items:
            $ref: '#/components/schemas/StageSpec'
        limits:
          $ref: '#/components/schemas/Limits'
        network:
          type: string
          enum:
            - none
            - full
          default: full
          description: 网络策略。none 为无网络；full 可以访问外部网络。
        concurrency:
          type: string
          enum:
            - forbid
            - allow
          default: forbid
          description: |
            同一任务能否同时有多个运行。forbid 时，已有运行未结束会拒绝 API 发起的新运行（`run_in_progress`），
            定时和 webhook 触发记为已跳过，`skip_reason` 为 overlap。
        credentials:
          type: array
          maxItems: 20
          description: |
            任务需要的凭证。这里只写引用名，不写明文。引用名与凭证的绑定是授权（grantCredential），不随版本变化；
            缺少绑定时用 credential_request 请用户填写。
          items:
            $ref: '#/components/schemas/ManifestCredential'
        tools:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 允许使用的已登记工具名（技术设计第 7.8 节）。
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        runner_labels:
          type: array
          maxItems: 10
          uniqueItems: true
          description: 只由带有全部这些标签的 runner 执行。省略时任何 runner 都可以执行。
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_.-]{0,62}$
          examples:
            - - intranet
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        side_effects:
          type: boolean
          default: false
          description: |
            任务会改动外部系统（发消息、写数据）。为 true 时，失败后不要自动重跑，先和用户确认。
        panels:
          type: array
          maxItems: 8
          description: |
            Agent 面板：在任务和运行看板上展示任务上报结果（`sbx result` 的 data）中的数据。平台只渲染这几种声明式类型，
            不执行 HTML 或脚本。结果中没有对应数据时不显示该面板。
          items:
            $ref: '#/components/schemas/PanelSpec'
    RuntimeSpec:
      type: object
      description: |
        运行时（技术设计第 7.3 节）。language 和 version 的组合只能从 `discover` 返回的运行时目录中选，
        不在目录中的组合以 422 `validation_failed` 拒绝。
      required:
        - language
        - version
      additionalProperties: false
      properties:
        language:
          type: string
          enum:
            - python
            - node
            - shell
          description: |
            python 为 Python 3.12，用 uv 管理依赖；node 为 Node.js 22，用 npm 管理依赖，`.ts` 文件由 Node 的类型剥离直接运行；
            shell 为 Bash 5 和常用命令行工具，没有依赖管理。
        version:
          type: string
          enum:
            - '3.12'
            - '22'
            - '5'
          description: 运行时版本：python 为 `3.12`，node 为 `22`，shell 为 `5`。与语言不对应的组合以 422 拒绝。
          examples:
            - '3.12'
        lockfile:
          type: string
          enum:
            - uv.lock
            - package-lock.json
          description: |
            依赖锁文件，必须与语言对应：python 为 `uv.lock`（任务文件中同时要有 `pyproject.toml`），
            node 为 `package-lock.json`（同时要有 `package.json`，按 `npm ci` 安装）。平台按锁文件安装依赖并缓存环境；
            不设置时只能使用运行时自带的库。shell 不支持锁文件。
    StageSpec:
      type: object
      required:
        - id
        - name
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
          description: 阶段 ID，`sbx stage` 用它引用阶段。
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 显示名。
        after:
          type: array
          maxItems: 50
          uniqueItems: true
          description: 依赖的阶段 ID。有依赖时控制台显示简图。
          items:
            type: string
    Limits:
      type: object
      description: 资源上限。省略的字段使用默认值。
      additionalProperties: false
      properties:
        timeout:
          type: string
          pattern: ^[1-9][0-9]*(s|m|h)$
          default: 10m
          description: 执行时限，最长 24h。超时后容器被停止，运行标为已超时。
          examples:
            - 10m
        cpu:
          type: number
          minimum: 0.1
          maximum: 8
          default: 1
          description: CPU 核数上限。
        memory:
          type: string
          pattern: ^[1-9][0-9]*(Mi|Gi)$
          default: 1Gi
          description: 内存上限，最小 64Mi，最大 16Gi。超出时进程被杀死，运行标为失败并注明 out_of_memory。
          examples:
            - 512Mi
    ManifestCredential:
      type: object
      description: |
        任务需要的一个凭证。凭证本身属于某个用户，由所有者按引用名授权给任务（技术设计第 12.4、12.5 节）。
        运行时按 `as` 注入：env 时凭证的每个字段成为一个同名环境变量；file 时写入 `/run/secrets/<name>/<字段名>`。
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: 引用名，任务内唯一。凭证授权和填写请求都用它指明是哪一个凭证。
          examples:
            - LLM_API_KEY
        as:
          type: string
          enum:
            - env
            - file
          default: env
          description: 注入方式。
        description:
          type: string
          maxLength: 200
          description: 用途说明，显示在任务详情和填写页上。
        optional:
          type: boolean
          default: false
          description: 为 true 时缺少这个凭证也照常运行；否则准备阶段以 `credential_missing` 失败。
    RetryPolicy:
      type: object
      description: |
        自动重试（技术设计第 8.5 节），默认关闭。每次重试是一个新的运行，`retry_of` 指向上一次尝试。
        取消、凭证不可用、校验失败、队列已满不重试。
      additionalProperties: false
      properties:
        max_attempts:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
          description: 失败后最多再重试几次。0 表示不重试。
        delay:
          type: string
          pattern: ^[1-9][0-9]*(s|m|h)$
          default: 30s
          description: 每次重试前等待的时间，最长 1h。
        'on':
          type: array
          uniqueItems: true
          description: 哪些结束状态会重试，省略时为 failed、timed_out、interrupted。
          items:
            type: string
            enum:
              - failed
              - timed_out
              - interrupted
    PanelSpec:
      type: object
      description: |
        一个 Agent 面板。`source` 是指向结果数据的 JSON Pointer，各类型需要的数据形状：

        - metric：数字，或 `{"value": 数字, "label": 文字}`。
        - bars、breakdown：`[{"label": 文字, "value": 数字}]`。bars 设置 `history` 时，改为取最近若干次运行中 `source` 指向的数字，按运行时间排列。
        - table：对象数组，按 `columns` 取列，最多显示 50 行。
        - text：纯文本，最长 2000 个字符，不解析 Markdown 或 HTML。

        数据形状不符时控制台不显示该面板，不报错。
      required:
        - id
        - type
        - title
        - source
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
          description: 面板 ID，清单内唯一。
        type:
          type: string
          enum:
            - metric
            - bars
            - breakdown
            - table
            - text
        title:
          type: string
          minLength: 1
          maxLength: 40
          description: 面板标题。
        source:
          type: string
          maxLength: 200
          pattern: ^(/.*)?$
          description: 结果 data 中的位置，JSON Pointer，例如 `/new_leads`；空字符串表示整个 data。
          examples:
            - /high_intent
        unit:
          type: string
          maxLength: 16
          description: 数值的单位，显示在数字后面。
        history:
          type: integer
          minimum: 2
          maximum: 30
          description: 只用于 bars：取最近多少次上报了结果的运行。
        columns:
          type: array
          maxItems: 8
          description: 只用于 table：要显示的列。省略时取第一行的前 8 个键。
          items:
            $ref: '#/components/schemas/PanelColumn'
    PanelColumn:
      type: object
      required:
        - key
        - title
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: 行对象中的键。
        title:
          type: string
          minLength: 1
          maxLength: 40
          description: 列标题。
    TaskFileInput:
      type: object
      required:
        - path
        - content
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 255
          description: 相对路径，用 `/` 分隔，不能以 `/` 开头，不能包含 `..` 或空段。
          examples:
            - main.py
        content:
          type: string
          description: 文件内容，UTF-8 文本。
        executable:
          type: boolean
          default: false
          description: 是否可执行。
    TaskFile:
      type: object
      description: 版本中的一个文件。不含内容。
      required:
        - path
        - size
        - sha256
        - executable
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: 字节数。
        sha256:
          type: string
          description: 内容的 SHA-256，十六进制。
        executable:
          type: boolean
    ApplyTaskRequest:
      type: object
      description: |
        提交任务的一个新版本：完整的清单和全部文件。没有列出的文件不会保留到新版本中。
        文件最多 100 个，总大小不超过 1 MiB。
        清单或文件中含有调用者自己的凭证、或任务已绑定的凭证的值（或它的 base64、URL 编码、JSON 转义）时，提交被拒绝，返回 422 `validation_failed`，
        `errors` 指出位置和凭证名，预览也一样。凭证在清单的 `credentials` 中引用，由平台在运行时注入。
      required:
        - manifest
        - files
      additionalProperties: false
      properties:
        manifest:
          $ref: '#/components/schemas/Manifest'
        files:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskFileInput'
    ApplyTaskResult:
      type: object
      description: |
        提交任务的结果。正式提交时 `task` 为提交后的任务；`dry_run` 为 true 时什么都不保存，`task` 为提交前的任务，
        任务尚不存在时为 null。
      required:
        - dry_run
        - created
        - version
        - task
        - diff
        - warnings
      properties:
        dry_run:
          type: boolean
        created:
          type: boolean
          description: 这次提交建立了新任务；预览时表示将会建立。
        version:
          type: integer
          description: 生成的版本号；预览时为将会生成的版本号。
        task:
          oneOf:
            - $ref: '#/components/schemas/Task'
            - type: 'null'
        diff:
          description: 与激活版本的差异；没有激活版本时与上一个版本比较；新任务为 null。
          oneOf:
            - $ref: '#/components/schemas/TaskDiff'
            - type: 'null'
        warnings:
          type: array
          description: 不阻止提交、但运行或激活前需要处理的问题，例如缺少凭证、没有满足标签的在线 runner。
          items:
            $ref: '#/components/schemas/ValidationIssue'
    TaskVersion:
      type: object
      description: 任务的一个不可变版本。
      required:
        - seq
        - created_at
        - created_by
        - client
        - tested_at
        - tree_hash
        - manifest
        - files
      properties:
        seq:
          type: integer
          description: 版本号，从 1 开始递增。
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          description: 提交这个版本的用户。
        client:
          type:
            - string
            - 'null'
          description: 提交时使用的访问令牌名，通常对应 Agent 和机器。从控制台或会话提交时为 null。
          examples:
            - Claude Code · 笔记本
        tested_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 第一次成功测试运行的结束时间。没有成功的测试运行时为 null。
        tree_hash:
          type: string
          description: 文件树的哈希。两个版本的文件完全相同时它也相同。
        manifest:
          $ref: '#/components/schemas/Manifest'
        files:
          type: array
          items:
            $ref: '#/components/schemas/TaskFile'
    TaskState:
      type: string
      description: |
        任务的启用状态（技术设计第 5.2 节）。active 为已激活，触发器按计划运行激活的版本；
        inactive 为未激活或已暂停，触发器不产生运行，仍可以手动发起运行。
      enum:
        - active
        - inactive
    Task:
      type: object
      description: 一个自动化任务和它的最新版本。
      required:
        - id
        - project_id
        - name
        - description
        - tags
        - state
        - active_version
        - latest_version
        - console
        - created_by
        - created_at
        - updated_at
        - archived_at
        - links
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/TaskName'
        description:
          type: string
          description: 最新版本清单中的用途说明，没有时为空字符串。
        tags:
          $ref: '#/components/schemas/TaskTags'
        state:
          $ref: '#/components/schemas/TaskState'
        active_version:
          type:
            - integer
            - 'null'
          description: 激活的版本号。触发器只运行激活的版本。从未激活时为 null。
        latest_version:
          $ref: '#/components/schemas/TaskVersion'
        console:
          $ref: '#/components/schemas/TaskConsole'
        created_by:
          type: string
          format: uuid
          description: 建立任务的用户。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 归档时间。归档的任务不再触发，也不能运行或修改；未归档时为 null。
        links:
          $ref: '#/components/schemas/Links'
    TaskSummary:
      type: object
      description: 任务列表中的一项。
      required:
        - id
        - project_id
        - name
        - description
        - tags
        - state
        - active_version
        - latest_version
        - last_run
        - next_run_at
        - active_runs
        - updated_at
        - links
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/TaskName'
        description:
          type: string
        tags:
          $ref: '#/components/schemas/TaskTags'
        state:
          $ref: '#/components/schemas/TaskState'
        active_version:
          type:
            - integer
            - 'null'
        latest_version:
          type: integer
          description: 最新版本号。
        last_run:
          description: 最近一次运行（不含测试运行），没有时为 null。
          oneOf:
            - $ref: '#/components/schemas/RunBrief'
            - type: 'null'
        next_run_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 下一次计划触发的时间。未激活或没有 cron 触发器时为 null。
        active_runs:
          type: integer
          description: 排队中、准备中、运行中和取消中的运行数。
        updated_at:
          type: string
          format: date-time
        links:
          $ref: '#/components/schemas/Links'
    TaskSummaryPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TaskSummary'
    TaskVersionSummary:
      type: object
      description: 版本列表中的一项。
      required:
        - seq
        - created_at
        - created_by
        - client
        - tested_at
        - active
        - description
        - runtime
        - file_count
        - tree_hash
      properties:
        seq:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        client:
          type:
            - string
            - 'null'
          description: 提交时使用的访问令牌名。
        tested_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 第一次成功测试运行的结束时间，没有时为 null。
        active:
          type: boolean
          description: 是否为当前激活的版本。
        description:
          type: string
        runtime:
          $ref: '#/components/schemas/RuntimeSpec'
        file_count:
          type: integer
        tree_hash:
          type: string
    TaskVersionPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TaskVersionSummary'
    TaskFileContent:
      type: object
      description: 版本中一个文件的内容。
      required:
        - path
        - size
        - sha256
        - executable
        - content
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        executable:
          type: boolean
        content:
          type: string
          description: 文件内容，UTF-8 文本。
    TaskDiff:
      type: object
      description: |
        两个版本之间的差异。补丁为 unified diff 格式；单个文件或整体过大时省略补丁，只给出增删行数。
      required:
        - base
        - target
        - manifest_patch
        - files
        - truncated
      properties:
        base:
          type:
            - integer
            - 'null'
          description: 比较基准的版本号。null 表示与空任务比较。
        target:
          type: integer
          description: 被比较的版本号；预览时为将会生成的版本号。
        manifest_patch:
          type:
            - string
            - 'null'
          description: 清单的差异，按格式化的 JSON 比较。清单没有变化时为 null。
        files:
          type: array
          description: 有变化的文件，按路径排序。没有变化的文件不列出。
          items:
            $ref: '#/components/schemas/FileDiff'
        truncated:
          type: boolean
          description: 差异总量超出上限，部分补丁被省略。
    FileDiff:
      type: object
      description: 一个文件的差异。
      required:
        - path
        - change
        - additions
        - deletions
        - patch
      properties:
        path:
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - modified
            - mode_changed
          description: mode_changed 表示只有可执行位变化。
        additions:
          type: integer
        deletions:
          type: integer
        patch:
          type:
            - string
            - 'null'
          description: unified diff。文件过大、不是文本或补丁被省略时为 null。
    ValidationIssue:
      type: object
      description: 校验发现的一个问题。
      required:
        - code
        - pointer
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        pointer:
          type:
            - string
            - 'null'
          description: 问题所在的位置，清单中的 JSON Pointer，例如 `#/manifest/credentials/0`。与位置无关时为 null。
        message:
          type: string
    ValidationReport:
      type: object
      description: |
        一个已提交版本在当前环境下能否运行和激活：清单与文件、运行时、凭证绑定、runner 标签、工具、激活前测试。
        `valid` 为 false 时运行会在准备阶段失败。
      required:
        - seq
        - valid
        - activatable
        - errors
        - warnings
      properties:
        seq:
          type: integer
        valid:
          type: boolean
          description: 没有 errors。
        activatable:
          type: boolean
          description: 可以激活：valid 为 true，并且满足激活前测试的要求。
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    SetTaskActivationRequest:
      type: object
      description: 激活或暂停任务。
      required:
        - active
      additionalProperties: false
      properties:
        active:
          type: boolean
          description: true 为激活，false 为暂停。暂停后触发器不再产生运行，已经开始的运行不受影响。
        version:
          type: integer
          minimum: 1
          description: 激活的版本号，省略时为最新版本。暂停时忽略。
    TaskConsole:
      type: object
      description: |
        任务在控制台上的显示选项。属于任务本身，不跟版本走，修改不产生新版本；由 Agent 用 setTaskConsole 设置，控制台不提供修改入口。
      required:
        - manual_run
      additionalProperties: false
      properties:
        manual_run:
          type: boolean
          default: true
          description: |
            控制台任务页是否显示“手动执行”按钮。为 false 时不显示，用浏览器会话发起运行也会返回 409 `manual_run_disabled`；
            访问令牌（Agent、CLI、脚本）发起的运行和对已结束运行的重跑不受影响。
    SetTaskConsoleRequest:
      type: object
      description: 设置任务在控制台上的显示选项。省略的字段保持不变。
      additionalProperties: false
      properties:
        manual_run:
          type: boolean
          description: 是否在控制台显示“手动执行”按钮。
    TaskCredential:
      type: object
      description: 任务清单引用的一个凭证当前的状态。不含任何凭证内容。
      required:
        - name
        - as
        - optional
        - status
        - credential
        - expires_at
        - pending_request_id
      properties:
        name:
          type: string
          description: 清单中的引用名。
        as:
          type: string
          enum:
            - env
            - file
        optional:
          type: boolean
        status:
          type: string
          enum:
            - bound
            - missing
            - revoked
            - expired
          description: bound 已绑定且有效；missing 没有绑定；revoked、expired 绑定的凭证已撤销或已过期。
        credential:
          description: 绑定的凭证，没有绑定时为 null。
          oneOf:
            - $ref: '#/components/schemas/CredentialRef'
            - type: 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 绑定凭证的到期时间，不过期时为 null。
        pending_request_id:
          type:
            - string
            - 'null'
          format: uuid
          description: 为这个引用名发起、尚未完成的填写请求，没有时为 null。
    TaskCredentialList:
      type: object
      description: 任务引用的凭证，按清单中的顺序排列。依据激活版本；没有激活版本时依据最新版本。
      required:
        - version
        - items
      properties:
        version:
          type: integer
          description: 依据的版本号。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskCredential'
    TaskBundle:
      type: object
      description: |
        可移植的任务包（技术设计第 15.5 节），由 exportTask 生成，importTask 读取。它只描述任务本身：任务名、版本的清单和文件、
        触发器定义。不含运行记录、凭证的值和绑定、webhook 令牌，也不含项目、用户、任务等任何 ID，导入到哪个项目由导入的人决定。
      required:
        - format
        - format_version
        - name
        - exported_at
        - server_version
        - active_version
        - omitted_versions
        - versions
        - triggers
      additionalProperties: false
      properties:
        format:
          type: string
          enum:
            - lerryn.task-bundle
          description: 固定为 `lerryn.task-bundle`。
        format_version:
          type: integer
          minimum: 1
          maximum: 1
          description: 任务包格式的版本，目前为 1。
        name:
          $ref: '#/components/schemas/TaskName'
        exported_at:
          type: string
          format: date-time
        server_version:
          type: string
          maxLength: 100
          description: 导出时的服务端版本，只用于排查问题。
        active_version:
          type:
            - integer
            - 'null'
          minimum: 1
          description: 导出时激活的版本号（源部署中的版本号），没有激活版本时为 null。只作参考，导入后的任务不激活。
        omitted_versions:
          type: integer
          minimum: 0
          description: 导出版本历史时，因数量或大小上限没有带上的更早版本数。只导出一个版本时为 0。
        versions:
          type: array
          minItems: 1
          maxItems: 50
          description: 版本，按版本号从旧到新排列。最后一个是导出时所选的版本。
          items:
            $ref: '#/components/schemas/TaskBundleVersion'
        triggers:
          type:
            - array
            - 'null'
          maxItems: 20
          description: 触发器定义，与 setTriggers 的请求相同，不含 webhook 令牌。没有导出触发器时为 null。
          items:
            $ref: '#/components/schemas/TriggerInput'
        console:
          $ref: '#/components/schemas/TaskConsole'
          description: 任务在控制台上的显示选项，导入时照搬。较早导出的任务包没有这个字段，按默认值处理。
    TaskBundleVersion:
      type: object
      description: 任务包中的一个版本：完整的清单和全部文件，与 applyTask 的请求相同。
      required:
        - seq
        - created_at
        - manifest
        - files
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 1
          description: 源部署中的版本号。导入后重新从 1 编号。
        created_at:
          type: string
          format: date-time
          description: 在源部署中提交的时间，只作参考。
        manifest:
          $ref: '#/components/schemas/Manifest'
        files:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskFileInput'
    ImportTaskRequest:
      type: object
      description: 导入一个任务包。请求体最大 4 MiB。
      required:
        - bundle
      additionalProperties: false
      properties:
        bundle:
          $ref: '#/components/schemas/TaskBundle'
        name:
          $ref: '#/components/schemas/TaskName'
          description: 导入后的任务名，省略时用任务包中的 `name`。
    ImportedVersion:
      type: object
      description: 一个导入的版本在源部署和这个部署中的版本号。
      required:
        - source_seq
        - seq
      properties:
        source_seq:
          type: integer
          description: 任务包中的版本号。
        seq:
          type: integer
          description: 导入后的版本号；预览时为将会使用的版本号。
    ImportedTask:
      type: object
      description: 导入建立的任务。完整的任务用 getTask 读取。
      required:
        - id
        - project_id
        - name
        - latest_version
        - links
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/TaskName'
        latest_version:
          type: integer
          description: 最新版本号，即导入的版本数。
        links:
          $ref: '#/components/schemas/Links'
    ImportTaskResult:
      type: object
      description: |
        导入的结果。正式导入时 `task` 为新建的任务；`dry_run` 为 true 时什么都不保存，`task` 为 null。
      required:
        - dry_run
        - task
        - versions
        - triggers
        - credentials
        - warnings
      properties:
        dry_run:
          type: boolean
        task:
          oneOf:
            - $ref: '#/components/schemas/ImportedTask'
            - type: 'null'
        versions:
          type: array
          description: 导入的版本，从旧到新。
          items:
            $ref: '#/components/schemas/ImportedVersion'
        triggers:
          type: array
          description: 建立的触发器。webhook 触发器的 `webhook.token` 是新生成的令牌，只在这次响应中出现，请交给调用方保存；预览时为 null。
          items:
            $ref: '#/components/schemas/Trigger'
        credentials:
          type: array
          description: 最新版本清单引用的凭证。导入的任务还没有任何绑定，所以都是 missing，需要请用户填写或由所有者授权。
          items:
            $ref: '#/components/schemas/TaskCredential'
        warnings:
          type: array
          description: 不阻止导入、但运行或激活前需要处理的问题，例如缺少凭证、项目中没有登记清单引用的工具、没有满足标签的在线 runner。
          items:
            $ref: '#/components/schemas/ValidationIssue'
    RunStatus:
      type: string
      description: |
        运行状态（技术设计第 5.4 节）。queued 排队中；preparing 准备中；running 运行中；cancelling 取消中；
        completed 进程以 0 退出（业务是否成功看 `result`）；failed 准备失败或进程非 0 退出；timed_out 已超时；
        cancelled 已取消；interrupted 运行中断；skipped 已跳过。后六种是终态。
      enum:
        - queued
        - preparing
        - running
        - cancelling
        - completed
        - failed
        - timed_out
        - cancelled
        - interrupted
        - skipped
    StartRunRequest:
      type: object
      description: 发起一次运行。所有字段都可选。
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: 使用的版本号，省略时用最新版本。
        params:
          type: object
          additionalProperties: true
          description: 本次运行的参数，整体替换清单中的 `params`。含有已登记凭证的值（或它的 base64、URL 编码、JSON 转义）时请求被拒绝，返回 422 `validation_failed`。
        test:
          type: boolean
          default: false
          description: 标记为测试运行。版本的第一次成功测试运行会记在版本的 `tested_at` 上，激活前测试以此为准。
    RerunRequest:
      type: object
      description: 重跑一个运行。所有字段都可选。
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: 使用的版本号，省略时用最新版本。修复代码后重跑会用到新版本，`version` 如实记录。
        params:
          type: object
          additionalProperties: true
          description: 本次运行的参数，省略时沿用原运行的参数。沿用的参数同样检查，含有已登记凭证的值（或它的 base64、URL 编码、JSON 转义）时请求被拒绝，返回 422 `validation_failed`。
        test:
          type: boolean
          description: 标记为测试运行，省略时沿用原运行。
    RunError:
      type: object
      required:
        - code
        - stage
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        stage:
          type:
            - string
            - 'null'
