# Lerryn 公开 API 的根文件。各资源的路径和 schema 放在同名目录下，
# 由 `make generate` 用 Redocly CLI 打包成 api/bundled/openapi.yaml。
# 约定见 api/README.md。
openapi: 3.1.0
info:
  title: Lerryn API
  version: 0.9.0
  summary: 由外部 Agent 操作的自动化沙箱。
  description: |
    Lerryn 的公开 HTTP API。MCP 工具、CLI 和前端客户端都由这份契约生成。

    通用约定：

    - 路径以 `/api/v1` 开头。试用版提交任务版本须填写 `manifest.workflow`，已有版本仍可读取。
    - 鉴权：Agent 和 CLI 用访问令牌（`Authorization: Bearer wl_pat_...`），控制台用 cookie 会话。
    - 错误一律以 `application/problem+json` 返回，结构见 `Problem`，按 `code` 和 `next_actions` 决定下一步。
    - 每个响应都带 `X-Request-Id` 头，与错误体中的 `request_id` 相同，排查问题时提供它。
    - 列表接口使用游标分页：`?limit=&cursor=`，响应带 `items` 和 `next_cursor`。
    - 返回的资源带 `links.console`，指向控制台中的对应页面。
  contact:
    name: Lerryn
    url: https://github.com/niltavi/lerryn
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:33333
    description: 默认的本地部署地址。实际地址为部署配置中的 server.public_url。
security:
  - accessToken: []
  - sessionCookie: []
tags:
  - name: discover
    description: 发现：服务端版本、能力、运行时、Skill 版本和当前身份。
  - name: auth
    description: 内置账号的注册、登录和登出，单点登录，移动端配对。
  - name: me
    description: 当前用户、他的访问令牌和移动设备。
  - name: projects
    description: 项目、成员和角色。
  - name: tasks
    description: 任务、版本、校验和激活。
  - name: runs
    description: 运行、事件、日志和产物。
  - name: triggers
    description: 定时和 webhook 触发器。
  - name: overview
    description: 控制台概览看板。
  - name: credentials
    description: 凭证、填写请求和授权。凭证明文只出现在填写或配置凭证的请求体中。
  - name: notifications
    description: 通知渠道和订阅。
  - name: admin
    description: 平台管理：账号、设置、执行节点和审计。只有管理员能调用。
  - name: skills
    description: 随服务端发行的 Agent Skill。
  - name: tools
    description: 项目登记工具与平台内置工具。
