AIModelID:
  type: string
  minLength: 1
  maxLength: 200
  description: 服务商使用的模型 ID。

AIModelList:
  type: object
  additionalProperties: false
  required: [models]
  properties:
    models:
      type: array
      items:
        $ref: "#/AIModelID"
      description: 当前用户启用的模型，未配置时为空。

AIConfiguration:
  type: object
  additionalProperties: false
  required: [models]
  properties:
    base_url:
      type: string
      description: 已配置的 HTTPS API 基础地址，未配置时省略。
    models:
      type: array
      items:
        $ref: "#/AIModelID"

SetAIConfigurationBody:
  type: object
  additionalProperties: false
  required: [base_url, models]
  properties:
    base_url:
      type: string
      minLength: 1
      maxLength: 2048
      description: 服务商的 HTTPS API 基础地址，包含服务商要求的版本路径，例如 https://api.openai.com/v1。
    api_key:
      type: string
      writeOnly: true
      minLength: 1
      maxLength: 4096
      description: 服务商的 API Key。地址不变时可省略以保留现有 Key。
    models:
      type: array
      minItems: 1
      maxItems: 50
      uniqueItems: true
      description: 允许内置 AI 工具调用的模型。
      items:
        $ref: "#/AIModelID"

AIChatMessage:
  type: object
  additionalProperties: false
  required: [role, content]
  properties:
    role:
      type: string
      enum: [system, user, assistant]
    content:
      type: string
      minLength: 1
      maxLength: 8192

AIChatBody:
  type: object
  additionalProperties: false
  required: [model, messages]
  properties:
    model:
      $ref: "#/AIModelID"
    messages:
      type: array
      minItems: 1
      maxItems: 32
      description: 按对话顺序排列的文本消息。
      items:
        $ref: "#/AIChatMessage"

AIChatResult:
  type: object
  additionalProperties: false
  required: [model, content]
  properties:
    model:
      $ref: "#/AIModelID"
    content:
      type: string
      description: 模型生成的文本。
