# notifications 资源的 schema（技术设计第 14 节）。在根文件 components.schemas 中逐个登记。
# 通知渠道属于用户本人，订阅指向他能查看的项目或任务。
NotificationChannelKind:
  type: string
  description: |
    webhook 为通用 webhook，载荷为 NotificationEvent 的 JSON，带 HMAC 签名（见根文件的 webhooks）；
    feishu、slack 为对应机器人的 webhook 地址，平台按它们的消息格式发送同样的内容。
  enum: [webhook, feishu, slack]

NotificationEventType:
  type: string
  description: |
    可以订阅的事件。run_failed 执行失败；run_timed_out 已超时；run_interrupted 运行中断；
    credential_expiring 订阅范围内任务引用的凭证将在 7 天内到期。测试运行不发通知。
  enum: [run_failed, run_timed_out, run_interrupted, credential_expiring]

NotificationSubscriptionInput:
  type: object
  description: 订阅一个项目的全部任务，或其中一个任务。
  required: [project_id, events]
  additionalProperties: false
  properties:
    project_id:
      type: string
      format: uuid
    task_id:
      type: string
      format: uuid
      description: 只订阅这个任务。省略时订阅整个项目。
    events:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: "#/NotificationEventType"

NotificationSubscription:
  type: object
  required: [id, project, task, events]
  properties:
    id:
      type: string
      format: uuid
    project:
      $ref: "../common/schemas.yaml#/ProjectRef"
    task:
      description: 订阅的任务，订阅整个项目时为 null。
      oneOf:
        - $ref: "../common/schemas.yaml#/TaskRef"
        - type: "null"
    events:
      type: array
      items:
        $ref: "#/NotificationEventType"

NotificationDeliveryStatus:
  type: string
  description: pending 等待发送或重试；delivered 已送达（对方返回 2xx）；failed 重试用尽仍失败。
  enum: [pending, delivered, failed]

NotificationDelivery:
  type: object
  description: 一次通知的发送记录。
  required: [id, event_type, status, attempts, http_status, error, task, run_id, merged_count, created_at, last_attempt_at, delivered_at]
  properties:
    id:
      type: string
      format: uuid
    event_type:
      type: string
      description: NotificationEventType 的取值，或测试通知的 `test`。
    status:
      $ref: "#/NotificationDeliveryStatus"
    attempts:
      type: integer
    http_status:
      type: [integer, "null"]
      description: 最近一次尝试时对方返回的状态码，连接失败时为 null。
    error:
      type: [string, "null"]
      description: 最近一次失败的原因，例如超时、连接被拒绝。
    task:
      oneOf:
        - $ref: "../common/schemas.yaml#/TaskRef"
        - type: "null"
    run_id:
      type: [string, "null"]
      format: uuid
    merged_count:
      type: integer
      description: 合并进这条通知的事件数。同一任务连续失败时合并发送，避免刷屏。
    created_at:
      type: string
      format: date-time
    last_attempt_at:
      type: [string, "null"]
      format: date-time
    delivered_at:
      type: [string, "null"]
      format: date-time

NotificationDeliveryPage:
  allOf:
    - $ref: "../common/schemas.yaml#/CursorPage"
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/NotificationDelivery"

NotificationChannel:
  type: object
  description: 当前用户的一个通知渠道和它的订阅。目标地址可能含有机器人令牌，只返回打码后的形式。
  required: [id, name, kind, enabled, url_preview, subscriptions, last_delivery, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    kind:
      $ref: "#/NotificationChannelKind"
    enabled:
      type: boolean
    url_preview:
      type: string
      description: 打码后的目标地址，只保留协议、主机和末尾几个字符。
      examples: ["https://open.feishu.cn/…/a91c"]
    subscriptions:
      type: array
      items:
        $ref: "#/NotificationSubscription"
    last_delivery:
      description: 最近一次发送，没有时为 null。
      oneOf:
        - $ref: "#/NotificationDelivery"
        - type: "null"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

NotificationChannelList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/NotificationChannel"

CreatedNotificationChannel:
  type: object
  description: 新建的通知渠道。webhook 类型带签名密钥，只出现这一次。
  required: [channel, signing_secret]
  properties:
    channel:
      $ref: "#/NotificationChannel"
    signing_secret:
      type: [string, "null"]
      description: webhook 签名用的密钥，接收方用它校验 `X-Lerryn-Signature`。只出现这一次；feishu 和 slack 为 null。

CreateNotificationChannelRequest:
  type: object
  required: [name, kind, url]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
    kind:
      $ref: "#/NotificationChannelKind"
    url:
      type: string
      format: uri
      maxLength: 2048
      description: 目标地址，http 或 https。加密保存，之后只返回打码后的形式。
    enabled:
      type: boolean
      default: true
    subscriptions:
      type: array
      maxItems: 20
      items:
        $ref: "#/NotificationSubscriptionInput"

UpdateNotificationChannelRequest:
  type: object
  description: 要修改的字段。subscriptions 给出时整体替换。
  minProperties: 1
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
    url:
      type: string
      format: uri
      maxLength: 2048
    enabled:
      type: boolean
    subscriptions:
      type: array
      maxItems: 20
      items:
        $ref: "#/NotificationSubscriptionInput"

NotificationEventKind:
  type: string
  description: 通知载荷中的事件类别：NotificationEventType 的取值，加上测试通知 test。
  enum: [run_failed, run_timed_out, run_interrupted, credential_expiring, test]

NotificationRun:
  type: object
  required: [id, status, error_code, reason, version, attempt, link]
  properties:
    id:
      type: string
      format: uuid
    status:
      $ref: "../runs/schemas.yaml#/RunStatus"
    error_code:
      oneOf:
        - $ref: "../common/schemas.yaml#/ErrorCode"
        - type: "null"
    reason:
      type: [string, "null"]
      description: 脱敏后的简要原因，不超过 200 个字符。
    version:
      type: integer
    attempt:
      type: integer
    link:
      type: string
      format: uri
      description: 运行详情页。

NotificationCredential:
  type: object
  required: [id, name, expires_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    expires_at:
      type: string
      format: date-time

NotificationEvent:
  type: object
  description: |
    通用 webhook 通知的载荷。内容只有任务名、实际状态、错误类别、脱敏后的简要原因和控制台链接，不含凭证、日志或参数。
  required: [id, type, occurred_at, project, task, run, credential, merged_count, link]
  properties:
    id:
      type: string
      format: uuid
      description: 通知 ID，与请求头 `X-Lerryn-Delivery` 相同。重试时不变，接收方可以据此去重。
    type:
      $ref: "#/NotificationEventKind"
    occurred_at:
      type: string
      format: date-time
    project:
      $ref: "../common/schemas.yaml#/ProjectRef"
    task:
      oneOf:
        - $ref: "../common/schemas.yaml#/TaskRef"
        - type: "null"
    run:
      description: 运行相关的事件为最近一次运行，其他为 null。
      oneOf:
        - $ref: "#/NotificationRun"
        - type: "null"
    credential:
      description: credential_expiring 时为将要到期的凭证，其他为 null。
      oneOf:
        - $ref: "#/NotificationCredential"
        - type: "null"
    merged_count:
      type: integer
      minimum: 1
      description: 合并进这条通知的事件数。大于 1 表示同一任务连续失败了这么多次，只发这一条。
    link:
      type: string
      format: uri
      description: 控制台中处理这件事的页面。
