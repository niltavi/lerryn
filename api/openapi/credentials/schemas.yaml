# credentials 资源的 schema（技术设计第 12.3 至 12.5 节）。在根文件 components.schemas 中逐个登记。
# 除 FillCredentialRequestBody 外，这里的 schema 都不包含凭证明文；它只作为请求体，不出现在任何响应里。
CredentialFieldName:
  type: string
  description: 字段名，同时是注入时的环境变量名或文件名。
  pattern: "^[A-Z][A-Z0-9_]{0,63}$"
  examples: [PRICE_API_TOKEN]

CredentialFieldSpec:
  type: object
  description: 填写请求中的一个字段。
  required: [name]
  additionalProperties: false
  properties:
    name:
      $ref: "#/CredentialFieldName"
    label:
      type: string
      maxLength: 60
      description: 填写页上显示的名称，省略时显示字段名。
    description:
      type: string
      maxLength: 200
      description: 填写说明，例如在哪里获取这个值。
    secret:
      type: boolean
      default: true
      description: 是否为机密。为 false 的字段（例如区域）在填写页上明文显示输入内容，但同样加密保存、提交后不回显。
    multiline:
      type: boolean
      default: false
      description: 多行输入，例如证书或 Cookie。
    optional:
      type: boolean
      default: false

CreateCredentialRequestBody:
  type: object
  description: |
    发起凭证填写请求。新凭证给出 `task_id` 和 `name`（清单 credentials 中的引用名），填写后自动授权给该任务；
    更新已有凭证给出 `credential_id`，此时 task_id 和 name 可以省略。
  required: [purpose, fields]
  additionalProperties: false
  properties:
    task_id:
      type: string
      format: uuid
      description: 使用这个凭证的任务。
    name:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{0,63}$"
      description: 任务清单中的引用名，也是新凭证的名称。
    credential_id:
      type: string
      format: uuid
      description: 要更新的已有凭证。只能是调用者本人的凭证。
    purpose:
      type: string
      minLength: 1
      maxLength: 200
      description: 用途，显示在填写页上，例如“读取竞品价格接口”。
    fields:
      type: array
      minItems: 1
      maxItems: 10
      items:
        $ref: "#/CredentialFieldSpec"
    expires_in_minutes:
      type: integer
      minimum: 10
      maximum: 10080
      default: 1440
      description: 填写链接多少分钟后失效，默认 24 小时，最长 7 天。

FillCredentialRequestBody:
  type: object
  description: 在控制台填写的凭证内容。
  required: [values]
  additionalProperties: false
  properties:
    values:
      type: object
      description: 字段名到填写的内容。省略或留空的字段视为没有填写；请求中没有的字段名会被忽略。
      maxProperties: 10
      additionalProperties:
        type: string

CredentialRequestStatus:
  type: string
  description: pending 等待填写；fulfilled 已填写；expired 链接已过期；cancelled 已取消。
  enum: [pending, fulfilled, expired, cancelled]

CredentialRequest:
  type: object
  description: 一个凭证填写请求。填写链接只能由发起请求的用户本人登录后打开。
  required: [id, status, url, name, purpose, task, credential_id, fields, client, created_at, expires_at, fulfilled_at]
  properties:
    id:
      type: string
      format: uuid
    status:
      $ref: "#/CredentialRequestStatus"
    url:
      type: string
      format: uri
      description: 填写页的完整地址，交给用户在浏览器（包括手机浏览器）中打开。地址中不含任何机密。
    name:
      type: string
      description: 凭证名称（任务清单中的引用名）。
    purpose:
      type: string
    task:
      oneOf:
        - $ref: "../common/schemas.yaml#/TaskRef"
        - type: "null"
    credential_id:
      type: [string, "null"]
      format: uuid
      description: 填写后得到的凭证；更新请求为被更新的凭证。尚未创建凭证或凭证已删除时为 null。
    fields:
      type: array
      items:
        $ref: "#/CredentialFieldSpec"
    client:
      type: [string, "null"]
      description: 发起请求时使用的访问令牌名，填写页上显示为“由哪个 Agent 发起”。
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    fulfilled_at:
      type: [string, "null"]
      format: date-time

CredentialRequestPage:
  allOf:
    - $ref: "../common/schemas.yaml#/CursorPage"
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/CredentialRequest"

CredentialStatus:
  type: string
  description: active 可用；revoked 已撤销；expired 已过期。后两种状态下新运行在准备阶段以 `credential_unavailable` 失败。
  enum: [active, revoked, expired]

CredentialRef:
  type: object
  description: 对凭证的引用。不含内容。
  required: [id, name, owner, status]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    owner:
      $ref: "../common/schemas.yaml#/UserRef"
    status:
      $ref: "#/CredentialStatus"

CredentialGrant:
  type: object
  description: 凭证所有者把凭证授权给一个任务，按清单中的引用名注入。
  required: [task, name, granted_at]
  properties:
    task:
      $ref: "../common/schemas.yaml#/TaskRef"
    name:
      type: string
      description: 任务清单中的引用名。
    granted_at:
      type: string
      format: date-time

Credential:
  type: object
  description: 调用者本人的一个凭证。只有元信息，不含任何字段的值。
  required: [id, name, purpose, fields, status, version, expires_at, revoked_at, last_used_at, created_at, updated_at, grants]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    purpose:
      type: string
    fields:
      type: array
      description: 字段名。
      items:
        $ref: "#/CredentialFieldName"
    status:
      $ref: "#/CredentialStatus"
    version:
      type: integer
      description: 当前的内容版本，每次更新加 1。新运行使用领取时的当前版本。
    expires_at:
      type: [string, "null"]
      format: date-time
      description: 所有者在填写时设置的到期时间，不过期时为 null。
    revoked_at:
      type: [string, "null"]
      format: date-time
    last_used_at:
      type: [string, "null"]
      format: date-time
      description: 最近一次被运行领取的时间。
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    grants:
      type: array
      items:
        $ref: "#/CredentialGrant"

CredentialPage:
  allOf:
    - $ref: "../common/schemas.yaml#/CursorPage"
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/Credential"

GrantCredentialRequest:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{0,63}$"
      description: 任务清单中的引用名。同一任务的同一引用名只能绑定一个凭证，已有绑定会被替换。
