# credentials 资源的路径（技术设计第 12.3 至 12.5 节）。在根文件 paths 中按路径登记。
#
# 明文只有两个入口，都只认登录会话：服务端渲染的填写页 /c/{requestId}（不属于 JSON API），
# 和控制台填写框调用的 fillCredentialRequest。两者都不经过 MCP（技术设计第 9.2、12.4 节）。
credentialRequests:
  get:
    operationId: listCredentialRequests
    tags: [credentials]
    summary: 列出填写请求
    description: 列出等调用者本人填写的请求，最新的在前。默认只返回 pending 的。
    x-operation-kind: read
    x-mcp:
      expose: false
    parameters:
      - name: status
        in: query
        description: 只返回这个状态的请求。
        schema:
          $ref: "./schemas.yaml#/CredentialRequestStatus"
      - $ref: "../common/parameters.yaml#/Limit"
      - $ref: "../common/parameters.yaml#/Cursor"
    responses:
      "200":
        description: 一页填写请求。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialRequestPage"
      default:
        $ref: "../common/responses.yaml#/Problem"
  post:
    operationId: createCredentialRequest
    tags: [credentials]
    summary: 发起凭证填写请求
    description: |
      请调用者本人填写凭证，返回填写链接（技术设计第 12.4 节）。链接绑定发起请求的用户，其他人打开会被拒绝。
      用户填写后，平台加密保存，并按 `name` 授权给 `task_id` 对应的任务。之后用 getCredentialRequest 查询状态，
      只能拿到完成状态和凭证 ID，拿不到内容。带 `Idempotency-Key` 重试不会产生重复的请求。
    x-operation-kind: mutate
    x-mcp:
      expose: true
      tool: credential_request
      title: 请用户填写凭证
      description: |
        任务需要 Key、Cookie、Token 时，请用户本人填写：给出 task_id、name（清单 credentials 里的引用名）、purpose 和 fields。
        返回的 url 原样交给用户在浏览器中打开；不要在对话里让用户粘贴凭证，也不要把凭证写进代码、参数或清单。
        交出 url 后不要就此结束这一轮：立即用 api_call 调用一次 getCredentialRequest 查看 status，用户常常已经在另一个窗口填好。
        fulfilled 就直接继续测试、设置触发器和激活；pending 时才结束这一轮，请用户填好后告诉你。
    parameters:
      - $ref: "../common/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/CreateCredentialRequestBody"
    responses:
      "201":
        description: 已创建填写请求。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialRequest"
      default:
        $ref: "../common/responses.yaml#/Problem"

credentialRequest:
  get:
    operationId: getCredentialRequest
    tags: [credentials]
    summary: 读取填写请求
    description: 返回填写请求的状态。只有发起请求的用户本人能读取。不返回任何凭证内容。
    x-operation-kind: read
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialRequestID"
    responses:
      "200":
        description: 填写请求。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialRequest"
      default:
        $ref: "../common/responses.yaml#/Problem"
  delete:
    operationId: cancelCredentialRequest
    tags: [credentials]
    summary: 取消填写请求
    description: 取消一个尚未填写的请求，填写链接随即失效。对已结束的请求调用不会改变状态。
    x-operation-kind: mutate
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialRequestID"
    responses:
      "200":
        description: 取消后的请求。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialRequest"
      default:
        $ref: "../common/responses.yaml#/Problem"

credentialRequestValues:
  post:
    operationId: fillCredentialRequest
    tags: [credentials]
    summary: 提交填写内容
    description: |
      控制台的填写框用它提交凭证内容，效果与在填写页提交相同：加密保存，完成请求，新凭证按引用名授权给任务（技术设计第 12.4 节）。
      只接受登录会话，访问令牌和移动端的设备会话都不能调用。响应是完成后的请求，不回显任何内容；
      某一项不合要求时返回 422，`errors` 的 `pointer` 为 `#/values/{字段名}`，同样不引用填写的内容。
      请求已经填写过、过期或被取消时返回 409 `request_closed`。
    x-operation-kind: mutate
    x-mcp:
      expose: false
    security:
      - sessionCookie: []
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialRequestID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/FillCredentialRequestBody"
    responses:
      "200":
        description: 已完成的请求，`credential_id` 为保存后的凭证。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialRequest"
      default:
        $ref: "../common/responses.yaml#/Problem"

credentials:
  get:
    operationId: listCredentials
    tags: [credentials]
    summary: 列出凭证
    description: 列出调用者本人的凭证和它们的授权，按名称排序，包括已撤销和已过期的。不返回任何字段的值。
    x-operation-kind: read
    x-mcp:
      expose: false
    parameters:
      - name: status
        in: query
        description: 只返回这个状态的凭证。
        schema:
          $ref: "./schemas.yaml#/CredentialStatus"
      - $ref: "../common/parameters.yaml#/Limit"
      - $ref: "../common/parameters.yaml#/Cursor"
    responses:
      "200":
        description: 一页凭证。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialPage"
      default:
        $ref: "../common/responses.yaml#/Problem"

credential:
  get:
    operationId: getCredential
    tags: [credentials]
    summary: 读取凭证
    description: 返回调用者本人的一个凭证的元信息和授权。别人的凭证返回 `not_found`。
    x-operation-kind: read
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialID"
    responses:
      "200":
        description: 凭证。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/Credential"
      default:
        $ref: "../common/responses.yaml#/Problem"
  delete:
    operationId: revokeCredential
    tags: [credentials]
    summary: 撤销凭证
    description: |
      撤销凭证：之后的新运行在准备阶段以 `credential_unavailable` 失败，不会执行业务代码。
      已经启动的运行中已注入的值无法收回，需要时取消这些运行。授权记录保留，便于查看曾经授权给了哪些任务。
    x-operation-kind: mutate
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialID"
    responses:
      "200":
        description: 撤销后的凭证。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/Credential"
      default:
        $ref: "../common/responses.yaml#/Problem"

credentialPurge:
  post:
    operationId: deleteCredential
    tags: [credentials]
    summary: 删除已撤销的凭证
    description: |
      所有者可以永久删除已撤销的凭证、所有加密版本和任务授权。任务清单保留引用名，原绑定变为缺少凭证。
      尚未填写且未过期的更新请求被取消，历史请求保留状态并清除凭证 ID。审计记录保留。
      未撤销的凭证返回 422 `validation_failed`，不存在或属于其他用户的凭证返回 404 `not_found`。
    x-operation-kind: mutate
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialID"
    responses:
      "204":
        description: 已删除凭证。
      default:
        $ref: "../common/responses.yaml#/Problem"

grant:
  put:
    operationId: grantCredential
    tags: [credentials]
    summary: 授权凭证给任务
    description: |
      凭证所有者把自己的凭证授权给一个任务，按引用名注入。调用者必须是凭证所有者，并且能查看这个任务。
      同一任务的同一引用名已绑定其他凭证时，替换为这一个。
    x-operation-kind: mutate
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialID"
      - $ref: "../common/parameters.yaml#/TaskID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/GrantCredentialRequest"
    responses:
      "200":
        description: 授权。
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/CredentialGrant"
      default:
        $ref: "../common/responses.yaml#/Problem"
  delete:
    operationId: revokeGrant
    tags: [credentials]
    summary: 取消授权
    description: 取消凭证对任务的授权。之后这个任务的新运行拿不到它。
    x-operation-kind: mutate
    x-mcp:
      expose: false
    parameters:
      - $ref: "../common/parameters.yaml#/CredentialID"
      - $ref: "../common/parameters.yaml#/TaskID"
    responses:
      "204":
        description: 已取消授权。
      default:
        $ref: "../common/responses.yaml#/Problem"
