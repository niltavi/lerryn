<body>
<x-dc>
<helmet>
<style>

</helmet>
<div class="wl-app {{theme}}" style="width: 1440px; height: 520px; min-height: 0; padding: 64px 48px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; align-items: start;">

      <span class="copyline" style="padding: 6px 12px;"><code>cred_01JDA9D7</code></span>
      <span class="body-sm muted">可以回到 Agent 了</span>
    </div>
  </x-import>

  <x-import component-from-global-scope="Lerryn.Card">
    <div class="stack" style="gap: 14px; padding: 12px; align-items: flex-start;">
      <span class="g g--idle g--lg" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M10 2h4"/><path d="m12 14 3-3"/><circle cx="12" cy="14" r="8"/></svg></span>

  </x-import>

  <x-import component-from-global-scope="Lerryn.Card">
    <div class="stack" style="gap: 14px; padding: 12px; align-items: flex-start;">
      <span class="g g--idle g--lg" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <h2 class="h3">不属于当前账号</h2>
      <x-import component-from-global-scope="Lerryn.Button" variant="secondary" size="sm">切换账号</x-import>
    </div>
  </x-import>

  <x-import component-from-global-scope="Lerryn.Card">
    <div class="stack" style="gap: 14px; padding: 12px; align-items: flex-start;">
      <span class="g g--key g--lg" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg></span>

      <a class="body-sm" href="Settings-Credentials.dc.html" style="font-weight: 600;">在我的凭证中更新</a>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":520}}'>

  renderVals() {
    return { theme: this.props.dark ? 'theme-dark' : '', s22: 22 };
  }
}
</script>
</body>
</html>
