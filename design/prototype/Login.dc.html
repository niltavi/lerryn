<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lerryn/components/bundle.css">
<link rel="stylesheet" href="console.css">
<script src="ds/lerryn/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="wl-app {{theme}}">
<div class="auth">
  <div class="auth-col">
    <div class="stack" style="align-items: center; gap: 14px;">
      <span class="rail-logo" style="width: 64px; height: 64px; border-radius: 20px; margin: 0;"><img src="/_blob/46d7ba75db40f7da30f9bb6f6115b8fb" alt="Lerryn" width="46" height="17" style="width: 46px;"></span>
      <h1 class="h2">登录</h1>
      <span class="mono-sm muted">lerryn.example.com</span>
    </div>

    <sc-if value="{{showPassword}}" hint-placeholder-val="{{ true }}">
      <div class="stack" style="gap: 14px;">
        <x-import component-from-global-scope="Lerryn.TextField">
          <x-import component-from-global-scope="Lerryn.Label">用户名</x-import>
          <x-import component-from-global-scope="Lerryn.Input" default-value="zhanglin"></x-import>
        </x-import>
        <div class="wl-field {{pwInvalid}}">
          <div class="spread"><label class="wl-field__label" for="login-pw">密码</label><span class="caption muted" tabindex="0" data-tip="由管理员重置" data-tip-pos="bottom">忘记密码</span></div>
          <div class="pw-wrap">
            <input id="login-pw" class="wl-field__input" type="password" value="password1234" autocomplete="current-password" required>
            <button class="pw-eye" type="button" aria-label="显示密码"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
            <div class="wl-field__error" role="alert">用户名或密码不正确</div>
          </sc-if>
        </div>
        <x-import component-from-global-scope="Lerryn.Button" size="lg" is-block="{{yes}}">登录</x-import>
        <div class="or">或</div>
      </div>
    </sc-if>

    <x-import component-from-global-scope="Lerryn.Button" variant="{{ssoVariant}}" size="lg" is-block="{{yes}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>企业账号登录</x-import>

    <div class="spread" style="justify-content: center; gap: 20px;">
      <sc-if value="{{showRegister}}" hint-placeholder-val="{{ true }}">
        <a class="body-sm" href="Register.dc.html" style="font-weight: 600;">注册</a>
      </sc-if>
      <sc-if value="{{ssoOnly}}" hint-placeholder-val="{{ false }}">
        <a class="body-sm" href="Login.dc.html">管理员登录</a>
      </sc-if>
      <button class="chip" type="button" style="height: 32px; padding: 0 10px; font-size: 13px;" aria-label="切换为 English"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>English</button>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["开放注册","关闭开放注册","仅单点登录"],"default":"开放注册"},"showError":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? '开放注册';
    const ssoOnly = mode === '仅单点登录';
    const showError = !!this.props.showError && !ssoOnly;
    return {
      theme: this.props.dark ? 'theme-dark' : '',
      yes: true,
      showPassword: !ssoOnly,
      ssoOnly: ssoOnly,
      ssoVariant: ssoOnly ? 'primary' : 'secondary',
      showRegister: mode === '开放注册',
      showError: showError,
      pwInvalid: showError ? 'wl-field--invalid' : ''
    };
  }
}
</script>
</body>
</html>
