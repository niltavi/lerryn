  <div class="row" style="gap: 16px;">
    <span class="avatar" style="width: 64px; height: 64px; font-size: 24px;">张</span>
    <div class="stack" style="gap: 2px;">
      <span class="h3">张林</span>
      <span class="row mono-sm muted" style="gap: 8px;">zhanglin<span class="tag tag--kraft" style="font-family: var(--font-sans);">管理员</span></span>
    </div>
  </div>

  <div style="max-width: 720px;">
  <x-import component-from-global-scope="Lerryn.Card">
    <div class="rowi">
      <span class="ic-box"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg></span>

      <input id="acc-name" class="wl-field__input" value="张林" style="width: 220px; height: 40px; border-radius: 12px; margin: 0;">
    </div>
    <div class="rowi">
      <span class="ic-box"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>

    <div class="rowi">

      <span class="row" style="gap: 8px;"><span class="mono-sm muted">sso.example.com</span><span class="g g--ok" role="img" aria-label="已关联"><x-import component-from-global-scope="Lerryn.Icon" name="check" size="{{s13}}"></x-import></span></span>
    </div>
    <div class="rowi">
      <span class="ic-box"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>

    <div class="rowi">
      <span class="ic-box"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
