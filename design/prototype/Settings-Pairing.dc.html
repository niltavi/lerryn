<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 21;
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || y > 6 || x < 0 || x > 6) return null;
      return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
    };
    const qr = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let f = finder(r, c, 0, 0);
        if (f === null) f = finder(r, c, 0, 14);
        if (f === null) f = finder(r, c, 14, 0);
        let on;
        if (f !== null) on = f;
        else if ((r === 7 || c === 7) && r < 8 && c < 8) on = false;
        else if ((r === 7 && c >= 13) || (c === 13 && r < 8) || (c === 7 && r >= 13) || (r === 13 && c < 8)) on = false;
        else if (r === 6) on = c % 2 === 0;
        else if (c === 6) on = r % 2 === 0;
        else on = ((r * 7 + c * 13 + r * c) % 5) < 2;
        qr.push({ k: on ? '' : 'o' });
      }
    }
    return { theme: this.props.dark ? 'theme-dark' : '', yes: true, qr: qr };
  }
}
</script>
