<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>概览 · 首次使用</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lerryn/components/bundle.css">
<link rel="stylesheet" href="console.css">
<script src="ds/lerryn/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="wl-app {{theme}}">
<div class="app">

<nav class="rail" aria-label="主导航">
  <a class="rail-logo" href="Overview-Empty.dc.html" aria-label="Lerryn"><img src="/_blob/46d7ba75db40f7da30f9bb6f6115b8fb" alt="" width="32" height="12"></a>
  <a class="ri on" href="Overview-Empty.dc.html" aria-label="概览" aria-current="page" data-tip="概览"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></a>
  <a class="ri" href="Runs.dc.html" aria-label="运行" data-tip="运行"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></a>
  <a class="ri" href="Settings-Credentials.dc.html" aria-label="凭证" data-tip="凭证"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg></a>
  <div class="rail-foot">
    <a class="ri" href="Settings-Tokens.dc.html" aria-label="个人设置" data-tip="周宁 · 个人设置"><span class="avatar">周</span></a>
  </div>
</nav>

<section class="list" aria-label="任务列表">
  <div class="list-head">
    <h2 class="list-title">任务<span class="n">0</span></h2>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 48px 20px; color: var(--ink-muted);">
    <span class="g g--idle g--lg" aria-hidden="true"><x-import component-from-global-scope="Lerryn.Icon" name="box" size="{{s22}}"></x-import></span>
    <span class="body-sm">尚无任务</span>
  </div>
</section>

<main class="board" style="justify-content: center;">
  <div class="stack" style="gap: 28px; max-width: 560px; width: 100%; margin: 0 auto;">
    <span style="width: 64px; height: 64px; border-radius: 20px; background: var(--kraft-soft); color: var(--kraft-strong); display: grid; place-items: center;"><x-import component-from-global-scope="Lerryn.Icon" name="wave" size="{{s32}}"></x-import></span>
    <h1 class="h1">接入你的 Agent</h1>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
      <li class="spread" style="padding: 14px 16px; border-radius: 20px; background: var(--liner-2); flex-wrap: nowrap;">
        <span class="row" style="gap: 12px; flex-wrap: nowrap;"><span class="num" style="color: var(--kraft-strong);">1</span><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg><span style="font-weight: 600;">访问令牌</span></span>
        <a class="chip" href="Settings-Tokens.dc.html" style="height: 36px; color: var(--ink);"><x-import component-from-global-scope="Lerryn.Icon" name="plus" size="{{s16}}"></x-import>新建</a>
      </li>
      <li class="stack" style="gap: 10px; padding: 14px 16px; border-radius: 20px; background: var(--liner-2);">
        <span class="row" style="gap: 12px;"><span class="num" style="color: var(--kraft-strong);">2</span><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg><span style="font-weight: 600;">MCP</span></span>
        <div class="copyline" style="background: var(--liner);"><code>https://lerryn.example.com/mcp</code><span data-tip="复制" data-tip-pos="bottom"><x-import component-from-global-scope="Lerryn.Button" variant="ghost" size="sm" is-icon-only="{{yes}}" accessibility-label="复制 MCP 地址"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></x-import></span></div>
      </li>
      <li class="row" style="gap: 12px; padding: 14px 16px; border-radius: 20px; border: 1.5px dashed var(--line-strong);">
        <span class="num" style="color: var(--kraft-strong);">3</span><x-import component-from-global-scope="Lerryn.Icon" name="wave" size="{{s18}}"></x-import><span class="muted">告诉 Agent 要自动化什么</span>
      </li>
    </ol>
  </div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'theme-dark' : '', yes: true, s16: 16, s18: 18, s22: 22, s32: 32 };
  }
}
</script>
</body>
</html>
