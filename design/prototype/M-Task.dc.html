<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>移动端 · 任务</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lerryn/components/bundle.css">
<link rel="stylesheet" href="console.css">
<script src="ds/lerryn/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="wl-app m-app {{theme}}" style="width: 390px; height: 860px; min-height: 0;">
  <header class="m-top">
    <a class="m-back" href="M-Overview.dc.html"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>概览</a>
    <span data-tip="复制链接" data-tip-pos="bottom"><x-import component-from-global-scope="Lerryn.Button" variant="ghost" size="sm" is-icon-only="{{yes}}" accessibility-label="复制任务链接"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></svg></x-import></span>
  </header>

  <div class="m-body">
    <div class="stack" style="gap: 6px;">
      <span class="eyebrow"><span class="live-dot"></span>已启用</span>
      <h1 class="h2">weekday-digest</h1>
      <p class="body-sm muted">工作日早上汇总 CRM 新线索，调用模型生成摘要并保存</p>
    </div>

    <div class="hero" style="gap: 12px 32px;">
      <div class="stat"><span class="stat-n">08:00<small>明天</small></span><span class="stat-l">下次执行</span></div>
      <div class="stat"><span class="stat-n stat-n--md">34</span><span class="stat-l">次运行</span></div>
    </div>

    <section class="strip" aria-label="近 4 周的运行">
      <div class="runs-strip" style="height: 84px; gap: 4px;">
        <sc-for list="{{runs}}" as="r" hint-placeholder-count="22"><a class="ridge {{r.cls}}" href="{{r.href}}" style="height: {{r.h}}px; flex: 1 1 0; min-width: 4px;" aria-label="{{r.label}}"></a></sc-for>
      </div>
      <div class="strip-axis"><span>10月7日</span><span>今天</span></div>
    </section>

    <div class="chips">
      <span class="chip" style="height: 36px;"><x-import component-from-global-scope="Lerryn.Icon" name="calendar-clock" size="{{s16}}"></x-import>每个工作日 08:00</span>
      <span class="chip" style="height: 36px;"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg>凭证 2<span class="dot" aria-label="有凭证即将过期"></span></span>
      <span class="chip" style="height: 36px;"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 12h6"/><path d="M15 12h6"/></svg>v8</span>
    </div>

    <x-import component-from-global-scope="Lerryn.Card">
      <div class="panel-head">
        <span class="panel-title"><span><x-import component-from-global-scope="Lerryn.Icon" name="wave" size="{{s18}}"></x-import></span>上次结果</span>
        <span class="caption muted">08:22</span>
      </div>
      <div class="hero" style="gap: 12px 28px;">
        <div class="stat"><span class="stat-n stat-n--md">42</span><span class="stat-l">新线索</span></div>
        <div class="stat"><span class="stat-n stat-n--md">7</span><span class="stat-l">高意向</span></div>
        <div class="stat"><span class="stat-n stat-n--md" style="color: var(--ink-muted);">3</span><span class="stat-l">去重</span></div>
      </div>
    </x-import>

    <div class="m-list">
      <a class="m-item" href="M-Run.dc.html"><span class="g g--ok" role="img" aria-label="执行完成"><x-import component-from-global-scope="Lerryn.Icon" name="check" size="{{s13}}"></x-import></span><span class="li-name">重跑 · v8</span><span class="li-meta">08:21 · 1m 07s</span></a>
      <a class="m-item" href="M-Run.dc.html"><span class="g g--ok" role="img" aria-label="执行完成"><x-import component-from-global-scope="Lerryn.Icon" name="check" size="{{s13}}"></x-import></span><span class="li-name">测试 · v8</span><span class="li-meta">08:18 · 1m 02s</span></a>
      <a class="m-item" href="M-Run.dc.html"><span class="g g--bad" role="img" aria-label="执行失败"><x-import component-from-global-scope="Lerryn.Icon" name="x" size="{{s13}}"></x-import></span><span class="li-name">定时 · v7</span><span class="li-meta bad">08:00 · 52.3s</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const secs = [54, 58, 51, 60, 56, 62, 49, 57, 59, 64, 55, 53, 58, 61, 50, 57, 66, 61, 58];
    const runs = secs.map((s) => ({ cls: '', h: Math.round(s * 1.0), href: 'M-Run.dc.html', label: '执行完成，' + s + ' 秒' }));
    runs.push({ cls: 'ridge--bad', h: 52, href: 'M-Run.dc.html', label: '今天 08:00 执行失败' });
    runs.push({ cls: '', h: 62, href: 'M-Run.dc.html', label: '今天 08:18 测试，执行完成' });
    runs.push({ cls: '', h: 67, href: 'M-Run.dc.html', label: '今天 08:21 重跑，执行完成' });
    return { theme: this.props.dark ? 'theme-dark' : '', yes: true, s13: 13, s16: 16, s18: 18, runs: runs };
  }
}
</script>
</body>
</html>
