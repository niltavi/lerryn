<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>填写凭证</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lerryn/components/bundle.css">
<link rel="stylesheet" href="console.css">
<script src="ds/lerryn/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="wl-app {{theme}}">
<div class="auth">
  <div class="auth-col auth-col--wide">
    <div class="spread">
      <span class="rail-logo" style="margin: 0;"><img src="/_blob/46d7ba75db40f7da30f9bb6f6115b8fb" alt="Lerryn" width="32" height="12"></span>
      <span class="row body-sm" style="gap: 8px;"><span class="avatar avatar--sm">张</span>zhanglin</span>
    </div>

    <x-import component-from-global-scope="Lerryn.Card">
      <div class="stack" style="gap: 20px; padding: 8px;">
        <div class="stack" style="gap: 14px;">
          <span class="g g--key g--lg" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg></span>
          <h1 class="h2">competitor-price-watch 需要凭证</h1>
          <div class="meta-chips">
            <span class="meta-chip"><x-import component-from-global-scope="Lerryn.Icon" name="wave" size="{{s14}}"></x-import>Codex · 工作站</span>
            <span class="meta-chip"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>仅此任务可用</span>
            <span class="meta-chip"><x-import component-from-global-scope="Lerryn.Icon" name="clock" size="{{s14}}"></x-import>今天 20:00 前</span>
          </div>
        </div>

        <div class="wl-field">
          <label class="wl-field__label" for="cred-key"><span class="mono" style="font-weight: 600;">PRICE_API_TOKEN</span></label>
          <div class="pw-wrap">
            <input id="cred-key" class="wl-field__input" type="password" value="sk-placeholder-value" autocomplete="off" required>
            <button class="pw-eye" type="button" aria-label="显示内容"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="wl-field__desc">读取竞品价格接口</div>
        </div>

        <x-import component-from-global-scope="Lerryn.TextField">
          <x-import component-from-global-scope="Lerryn.Label"><span class="mono" style="font-weight: 600;">PRICE_API_REGION</span></x-import>
          <x-import component-from-global-scope="Lerryn.Input" placeholder="可选"></x-import>
        </x-import>

        <x-import component-from-global-scope="Lerryn.Button" size="lg" is-block="{{yes}}">保存</x-import>
      </div>
    </x-import>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'theme-dark' : '', yes: true, s14: 14 };
  }
}
</script>
</body>
</html>
